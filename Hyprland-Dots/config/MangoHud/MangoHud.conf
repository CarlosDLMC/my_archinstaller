# MangoHud — RX 6700 XT / Samsung LS24A600N (2560x1440, FreeSync 48-75 Hz)
#
# The panel's VRR window is 48-75 Hz. 75/48 = 1.56x, which is under 2x, so
# there is no LFC: below 48 fps we fall out of the window and it gets ugly.
# Tune games so the *lows* stay above ~50, not just the average.

### Frame pacing -------------------------------------------------------------
# Cap a few fps under the 75 Hz ceiling so we stay inside the VRR window
# instead of sitting on its top edge, where the driver reverts to plain vsync.
# Comma-separated list: cycle it live with toggle_fps_limit to compare.
#   72 -> 13.89 ms, inside the window
#   75 -> 13.33 ms, pinned at the ceiling
#    0 -> uncapped
fps_limit=72,75,0
fps_limit_method=early

# Vulkan FIFO / OpenGL vsync. With VRR the panel follows the frame, so this
# is here to stop tearing rather than to force a fixed cadence.
vsync=3
gl_vsync=1

### Readout ------------------------------------------------------------------
fps
show_fps_limit
frametime
frame_timing
fps_metrics=avg,0.01

gpu_stats
gpu_temp
gpu_name
vram

cpu_stats
cpu_temp
ram

vulkan_driver
engine_short_names
resolution

### Start hidden: MangoHud still loads, so fps_limit and vsync apply;
### only the drawing is suppressed. Summon it with toggle_hud.
no_display

### Placement ----------------------------------------------------------------
position=top-left
font_size=20
background_alpha=0.4
round_corners=6

### Keys ---------------------------------------------------------------------
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
output_folder=/home/mentefria/mangologs
