# Hyprlock — Soviet brutalist TUI
#
# Deliberately matches the ly display manager (assets/ly/config.ini, with
# lang = soviet) so the login screen and the lock screen are the same machine:
# pure black, one monospace face, block-glyph bigclock, Russian labels.
#
# This file holds only what is identical on every machine. All widget geometry
# lives in hyprlock-monitors.conf, regenerated before each lock by
# scripts/SovietLockGen.py from the actual monitor list: hyprlock positions are
# absolute logical pixels, so hand-written ones are wrong on any other display,
# and one static file cannot size itself per monitor on a mixed-DPI setup.
#
# Everything the panel draws comes from scripts/SovietLock.py. hyprlock ignores
# literal \n in a `text =` field and only renders multi-line output that
# arrives via cmd[...], so the panel is emitted as one block with real
# newlines. That also guarantees the columns line up.
#
# Colours are fixed rather than sourced from wallust, exactly as ly is: the
# lock screen must not change character when the wallpaper does. To make it
# wallpaper-tinted instead, source the wallust file and swap $ink/$dim.
#
# hide_cursor is false so the keyboard-layout field can be clicked; set it
# true for a keyboard-only, ly-pure screen (ALT+SHIFT still switches layout).

$SL = python3 $HOME/.config/hypr/scripts/SovietLock.py

# The clock is its own shell script rather than another SovietLock.py mode: it
# re-runs once per second per monitor for as long as the lock lasts, so its
# cost is the only one here that matters. Invoked as `bash <script>` rather
# than by shebang, which skips an exec of env(1). Note the name deliberately
# does not start with $SL: hyprlang substitutes variables by name match, and
# a name that another variable is a prefix of invites a silent mis-expansion.
$BIGCLOCK = bash $HOME/.config/hypr/scripts/SovietClock.sh

$mono = JetBrainsMono Nerd Font Mono

$ink = rgb(D8D8D0)
$dim = rgb(6E7066)

general {
    hide_cursor = false
    immediate_render = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    color = rgb(000000)
}

# Per-monitor widgets, generated — see the note above. Must come after the
# variables it references.
source = $HOME/.config/hypr/hyprlock-monitors.conf
