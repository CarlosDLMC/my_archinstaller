# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock — Soviet brutalist TUI, for 1440p / 2K monitors
#
# Same design as hyprlock.conf, scaled by 1440/1080. See that file for the
# full explanation of why the panel is generated by a script, why the clock
# pads with NBSP, and how the input-field overlay is positioned.
#
# Layout metrics on this font at scale 1:
#   cell width = 0.7917 * font_size     row pitch = 1.736 * font_size
# Panel is 64 columns x 25 rows, so at font 19 it is 963 x 825 px.

$SL = python3 $HOME/.config/hypr/scripts/SovietLock.py
$mono = JetBrainsMono Nerd Font Mono

$ink = rgb(D8D8D0)
$dim = rgb(6E7066)

general {
    hide_cursor = false
    immediate_render = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    color = rgb(000000)
}

# ── bigclock, block glyphs, 5 rows ──
label {
    monitor =
    text = cmd[update:1000] $SL --clock
    color = $ink
    font_size = 29
    font_family = $mono
    position = 0, 485
    halign = center
    valign = center
}

# ── date, Russian, uppercased ──
label {
    monitor =
    text = cmd[update:60000] $SL --date
    color = $dim
    font_size = 19
    font_family = $mono
    position = 0, 316
    halign = center
    valign = center
}

# ── the panel: access, system state, power, weather ──
label {
    monitor =
    text = cmd[update:30000] $SL --panel
    color = $ink
    font_size = 19
    font_family = $mono
    position = 0, -134
    halign = center
    valign = center
}

# ── password, overlaid onto the panel's КОД ДОСТУПА row (row 6 of 25) ──
input-field {
    monitor =
    size = 613, 29
    outline_thickness = 0
    rounding = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_color = $ink
    font_family = $mono

    dots_text_format = *
    dots_size = 0.64
    dots_spacing = 0.2
    dots_center = false
    fade_on_empty = false
    hide_input = false

    placeholder_text =
    fail_text = <span foreground="##C42B1C" font_size="19pt"><b>НЕВЕРНЫЙ КОД ДОСТУПА · ПОПЫТКА $ATTEMPTS</b></span>
    check_text = <span foreground="##C7A017" font_size="19pt">ИДЁТ ПРОВЕРКА ДОКУМЕНТОВ...</span>

    position = 108, 83
    halign = center
    valign = center
}

# ── keyboard layout, overlaid on the panel's РАСКЛАДКА row (row 5) ──
# Click it to cycle, or press ALT+SHIFT / SUPER+SPACE - those binds are
# `bindld`, so they fire while the session is locked, and quickshell (running
# as `qs -c bar`) stays alive to serve the global. The click dispatches that
# same global rather than calling hyprctl directly, so the bar's MRU ordering
# and its OSD stay in step with what happens here.
#
# $LAYOUT redraws the instant the layout changes; the panel's own 30s refresh
# was far too slow for something you interact with. The bracket list is
# positional and must match kb_layout in configs/SystemSettings.conf
# (currently us,es,ru). Codes are the xkb short names the bar shows via
# quickshell/bar/scripts/layouts.py, so `us` reads EN, not US.
# Each entry is padded with non-breaking spaces purely to widen the click
# target: two glyphs is a ~22px box to hit, the padding makes it ~89px.
# NBSP because Pango trims ordinary trailing spaces away again.
#
# position.x is measured from the screen centre, NOT from the left edge:
# this config also renders on the other monitor, and an absolute x put
# the value outside the box there. Being centre-relative keeps it on the
# panel's value column at any width. It folds in half the label width
# (padding included) because the label is centre-aligned.
label {
    monitor =
    text = $LAYOUT[EN      ,ES      ,RU      ]
    color = $ink
    font_size = 19
    font_family = $mono
    onclick = hyprctl dispatch global quickshell:layoutNext
    position = -134, 107
    halign = center
    valign = center
}

# ── key hints, ly style ──
label {
    monitor =
    text = cmd[update:0] $SL --footer
    color = $dim
    font_size = 19
    font_family = $mono
    position = 0, -595
    halign = center
    valign = center
}
