#windowrule = workspace 1, tag:email*
#windowrule = workspace 2, tag:browser*
#windowrule = workspace 3, class:^([Tt]hunar)$
#windowrule = workspace 3, tag:projects*
#windowrule = workspace 5, tag:gamestore*
#windowrule = workspace 7, tag:im*
#windowrule = workspace 8, tag:games*

# windowrule move to workspace (silent)
#windowrule = workspace 4 silent, tag:screenshare*
#windowrule = workspace 6 silent, class:^(virt-manager)$
#windowrule = workspace 6 silent, class:^(.virt-manager-wrapped)$
#windowrule = workspace 9 silent, tag:multimedia*

# FLOAT
windowrule = match:tag KooL_Cheat*, float 1
windowrule = match:tag wallpaper*, float 1
windowrule = match:tag settings*, float 1
windowrule = match:tag viewer*, float 1
windowrule = match:tag KooL-Settings*, float 1
windowrule = match:class ([Zz]oom|onedriver|onedriver-launcher)$, float 1
windowrule = match:class (org.gnome.Calculator) title (Calculator), float 1
windowrule = match:class ^(mpv|com.github.rafostar.Clapper)$, float 1
windowrule = match:class ^([Qq]alculate-gtk)$, float 1
#windowrule = float, class:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = match:class ^([Ff]erdium)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, float 1
#windowrule = float, title:^(Firefox)$

# windowrule - ######### float popups and dialogue #######
windowrule = match:title ^(Authentication Required)$, float 1
windowrule = match:title ^(Authentication Required)$, center 1
windowrule = match:class (codium|codium-url-handler|VSCodium) title negative:(.*codium.*|.*VSCodium.*), float 1
windowrule = match:class ^(com.heroicgameslauncher.hgl)$ title negative:(Heroic Games Launcher), float 1
windowrule = match:class ^([Ss]team)$ title negative:^([Ss]team)$, float 1
windowrule = match:class ([Tt]hunar) title negative:(.*[Tt]hunar.*), float 1
windowrule = match:title ^(Add Folder to Workspace)$, float 1
windowrule = match:title ^(Add Folder to Workspace)$, size 70% 60%
windowrule = match:title ^(Add Folder to Workspace)$, center 1
windowrule = match:title ^(Save As)$, float 1
windowrule = match:title ^(Save As)$, size 70% 60%
windowrule = match:title ^(Save As)$, center 1
windowrule = match:initial_title (Open Files), float 1
windowrule = match:initial_title (Open Files), size 70% 60%
windowrule = match:title ^(SDDM Background)$, float 1 #KooL's Dots YAD for setting SDDM background
windowrule = match:title ^(SDDM Background)$, center 1 #KooL's Dots YAD for setting SDDM background
windowrule = match:title ^(SDDM Background)$, size 16% 12% #KooL's Dots YAD for setting SDDM background
# END of float popups and dialogue #######

# OPACITY
windowrule = match:tag terminal*, opacity 0.9 0.7

# SIZE
windowrule = match:tag KooL_Cheat*, size 65% 90%
windowrule = match:tag wallpaper*, size 70% 70%
windowrule = match:tag settings*, size 70% 70%
windowrule = match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$, size 60% 70%
windowrule = match:class ^([Ff]erdium)$, size 60% 70%

#windowrule = size 25% 25%, title:^(Picture-in-Picture)$
#windowrule = size 25% 25%, title:^(Firefox)$

# PINNING
windowrule = match:title ^(Picture-in-Picture)$, pin 1
#windowrule = pin,title:^(Firefox)$

# windowrule - extras
windowrule = match:title ^(Picture-in-Picture)$, keep_aspect_ratio true

# BLUR & FULLSCREEN
windowrule = match:tag games*, no_blur on
windowrule = match:tag games*, fullscreen 1

#This not gonna take the focus to the window that appears when hovering over some of the parts of the IntelliJ Products
windowrule = match:class ^(jetbrains-*), no_initial_focus on
windowrule = match:title ^(wind.*)$, no_initial_focus on

#windowrule = bordercolor rgb(EE4B55) rgb(880808), fullscreen 1:1
#windowrule = bordercolor rgb(282737) rgb(1E1D2D), float 1ing:1

# LAYER RULES
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 1, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 1, match:namespace notifications
layerrule = blur on, match:namespace quickshell:overview
layerrule = ignore_alpha 1, match:namespace quickshell:overview
layerrule = ignore_alpha 0.5, match:namespace quickshell:overview

