# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

windowrule = match:class ^(com.gabm.satty)$, float 1

# Float all JetBrains windows, then tile back the main editor
windowrule = match:class (jetbrains-.+), float 1
windowrule = match:class (jetbrains-.+), match:title (.*\[~/.*), tile 1

# Blur the wallpaper behind the bar. The bar draws no background of its own,
# so with no ignore_alpha rule this blurs the whole strip it occupies - the
# bar reads as a soft band rather than raw wallpaper. Needs the explicit
# namespace set in ~/.config/quickshell/bar/shell.qml.
layerrule = blur on, match:namespace quickshell:bar

# Thunar's rename, properties, bulk-rename and file-transfer dialogs are separate
# toplevels carrying the same class as the browser window, so they tile and take
# half the screen. Thunar has no in-view rename - the dialog is the only way it
# renames - so float it instead. Only the browser window's title ends in
# "- Thunar", so the negative title match leaves that one tiled.
#
# configs/WindowRules-config-v3.conf already tries this, but writes the two match
# fields space-separated (match:class X title Y). Hyprland 0.56 parses that
# without error and then never matches it; each field needs its own match: and a
# comma between them.
windowrule = match:class ^([Tt]hunar)$, match:title negative:(.* - Thunar$), float 1
windowrule = match:class ^([Tt]hunar)$, match:title negative:(.* - Thunar$), center 1
