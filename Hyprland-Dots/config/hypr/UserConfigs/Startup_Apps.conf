# Commands and Apps to be executed at launch

exec-once = yad --text="\n<span font='72' weight='bold'>TURN ON VPN / PROXY !!!</span>\n" --text-align=center --title="REMINDER" --button="OK":0 --width=900 --height=400 --center --on-top --fixed --undecorated
# Handy (speech-to-text) autostart is OFF to save RAM - the SUPER + CTRL + F8
# keybind in UserKeybinds.conf launches it on demand. Uncomment to autostart it:
# handy-start.sh starts it visible until a model has been chosen, hidden after.
# exec-once = $UserScripts/handy-start.sh
