# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

# Workspace switching with Ctrl+Alt+Arrows (like 3-finger swipe)
bind = CTRL ALT, left, workspace, r-1
bind = CTRL ALT, right, workspace, r+1

# Custom application launchers
bindd = $mainMod, T, open telegram, exec, Telegram
bindd = $mainMod, R, open RustRover, exec, rustrover
bindd = CTRL $mainMod, F8, Handy toggle transcription, exec, notify-send -t 1500 -i audio-input-microphone "Handy" "Toggling transcription" && handy --toggle-transcription








# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# Move ALL windows of the current workspace into another workspace
# ($mainMod ALT + number). Add --follow to also jump to the target.
bindd = $mainMod ALT, code:10, move whole workspace to 1, exec, $UserScripts/MoveWorkspaceWindows.py 1 --follow
bindd = $mainMod ALT, code:11, move whole workspace to 2, exec, $UserScripts/MoveWorkspaceWindows.py 2 --follow
bindd = $mainMod ALT, code:12, move whole workspace to 3, exec, $UserScripts/MoveWorkspaceWindows.py 3 --follow
bindd = $mainMod ALT, code:13, move whole workspace to 4, exec, $UserScripts/MoveWorkspaceWindows.py 4 --follow
bindd = $mainMod ALT, code:14, move whole workspace to 5, exec, $UserScripts/MoveWorkspaceWindows.py 5 --follow
bindd = $mainMod ALT, code:15, move whole workspace to 6, exec, $UserScripts/MoveWorkspaceWindows.py 6 --follow
bindd = $mainMod ALT, code:16, move whole workspace to 7, exec, $UserScripts/MoveWorkspaceWindows.py 7 --follow
bindd = $mainMod ALT, code:17, move whole workspace to 8, exec, $UserScripts/MoveWorkspaceWindows.py 8 --follow
bindd = $mainMod ALT, code:18, move whole workspace to 9, exec, $UserScripts/MoveWorkspaceWindows.py 9 --follow
bindd = $mainMod ALT, code:19, move whole workspace to 10, exec, $UserScripts/MoveWorkspaceWindows.py 10 --follow
