# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # LockRun.sh regenerates the per-monitor widgets (the idle path does not
    # go through LockScreen.sh, and the display set may have changed), starts
    # hyprlock, and logs its output plus exit code to
    # ~/.cache/hypr-logs/hyprlock.log. It refuses to start a second instance.
    lock_cmd = $HOME/.config/hypr/scripts/LockRun.sh # runs hyprlock if it is not already running (this is always run when "loginctl lock-session" is called) 
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# turn off screen faster if session is already locked
# (disabled by default)
# listener {
#     timeout = 30                            # 30 seconds
#     on-timeout = pidof hyprlock && hyprctl dispatch dpms off # turns off the screen if hyprlock is active
#     on-resume = pidof hyprlock && hyprctl dispatch dpms on    # command to run when activity is detected after timeout has fired.
# }

# Warn
listener {
    timeout = 540                     # 9 min
    on-timeout = notify-send -i $iDIR " You are idle!" # command to run when timeout has passed
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"  # command to run when activity is detected after timeout has fired.
}

# Screenlock on idle - DISABLED ON PURPOSE.
# Going idle must not lock the session; the lock screen is only ever raised
# deliberately, with CTRL+ALT+L (scripts/LockScreen.sh). Idle no longer blanks
# the screen either - see the disabled "Turn off screen" listener below.
# Re-enable by uncommenting this block.
# listener {
#     timeout = 600                     # 10 min
#     on-timeout = loginctl lock-session # command to run when timeout has passed
# }

# Turn off screen - DISABLED ON PURPOSE.
# The display must never blank on idle. Nothing here turns the screen off, so
# going AFK leaves the monitors exactly as they were.
#
# Re-enable by uncommenting the block below. It delegates to IdleDpms.sh, which
# blanks unless the session is locked AND we are on AC: the Soviet TUI lock
# screen is meant to stay readable at the desk, but on battery it would
# otherwise hold the display on all night. Edit that script to change the
# policy; drop it back to a plain `hyprctl dispatch dpms off` for the stock
# always-blank behaviour.
# listener {
#     timeout = 630                            # 10.5 min
#     on-timeout = $HOME/.config/hypr/scripts/IdleDpms.sh
#     on-resume = hyprctl dispatch dpms on    # command to run when activity is detected after timeout has fired.
# }

