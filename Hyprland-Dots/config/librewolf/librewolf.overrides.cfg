// LibreWolf reads this file at every start (copy.sh puts it in the profile
// root: ~/.config/librewolf/librewolf/, or ~/.librewolf/ on an older install).
// It is autoconfig JavaScript, not user.js - pref(), defaultPref() and lockPref() here.

// The pre-157 look. LibreWolf 157 switched on Firefox's "Nova" redesign -
// browser.nova.enabled gates some 580 interface style rules: rounder tabs, new
// toolbars and menus - plus a Nova variant of the new tab page, where the tile
// spacing in chrome/userContent.css no longer fits. defaultPref, so about:config
// can still turn either back on.
defaultPref("browser.nova.enabled", false);
defaultPref("browser.newtabpage.activity-stream.nova.enabled", false);

// Its own look, not the desktop's. Out of the box LibreWolf takes its interface
// colours from the GTK theme (browser.theme.native-theme) and tells websites
// whatever light/dark the desktop reports (content-override 2), and the GTK theme
// here is plain Adwaita, a light one. Instead: LibreWolf's own colours, always
// dark, no GTK colours for websites either, and "dark" for every website allowed
// to ask - Google's sign-in and account chooser among them. resistFingerprinting,
// below, still answers "light" to all the other sites.
defaultPref("browser.theme.native-theme", false);
defaultPref("widget.gtk.libadwaita-colors.enabled", false);
defaultPref("widget.gtk.theme-scrollbar-colors.enabled", false);
defaultPref("widget.non-native-theme.use-theme-accent", false);
defaultPref("ui.use_standins_for_native_colors", true);
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("layout.css.prefers-color-scheme.content-override", 0);

// Load chrome/userContent.css from the profile: the new-tab tile spacing and
// the no-ligatures rules live there.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// New tab page: 2 rows of pinned sites, 10 per row (8 is the built-in maximum;
// the page still drops to 8 or 6 when the window is under ~1390px wide).
// Set ONCE per profile, guarded by a marker, so a rows choice made later in the
// new tab's Customize panel survives restarts - a plain pref() would reset it
// at every start, and guarding on the pref itself fails for 1 row, which equals
// the default and so is stored as no value at all.
if (!getPref("my_archinstaller.newtab.seeded")) {
  pref("browser.newtabpage.activity-stream.topSitesRows", 2);
  pref("browser.newtabpage.activity-stream.topSitesMaxSitesPerRow", 10);
  pref("my_archinstaller.newtab.seeded", true);
}

// Sites that skip resistFingerprinting (comma-separated hostnames, no scheme;
// *.example.com matches subdomains). accounts.google.com: resistFingerprinting
// tells every site "light mode" - ui.systemUsesDarkTheme is ignored under it -
// so Google's sign-in and account chooser came up white. It is where you
// identify yourself to Google anyway.
defaultPref("privacy.resistFingerprinting.exemptedDomains", "accounts.google.com");

// WebRTC off, always: lockPref, so it is forced at every start and greyed out
// in about:config - no site can open a peer connection or leak the local IP.
lockPref("media.peerconnection.enabled", false);
