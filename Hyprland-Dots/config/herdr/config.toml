onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

# --- Background notifications ---------------------------------------------
# Only fire for agents in workspaces/tabs you are NOT currently looking at.

[ui.toast]
# off | herdr (in-app toast) | terminal | system (notify-send -> dunst)
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = false
# Relative paths resolve from this file's directory (~/.config/herdr).
# Must be .mp3. Omit both to use herdr's built-in tones.
done_path = "sounds/done.mp3"       # agent finished a turn
request_path = "sounds/request.mp3" # agent is blocked / needs you

# Per-agent overrides: default | on | off
[ui.sound.agents]
droid = "off"

# --- Sidebar legibility ----------------------------------------------------
[ui]
sidebar_width = 30
status_indicators = "symbols"   # distinct glyphs instead of color-only dots

# Brighten the muted greys the theme uses for secondary text.
[theme.custom]
# JetBrains "Dark" (PyCharm 2025.3, new UI), extracted from
# app.jar!/themes/expUI/expUI_darkScheme.xml. selection_bg is the one value not
# in that file (JetBrains derives it at runtime) - it is the new-UI convention.
panel_bg = "#1e1f22"      # editor background
sidebar_bg = "#2b2d30"    # tool-window background
active_row_bg = "#121316" # focused row. PyCharm's caret row (#26282e) is only
                          # 5 shades off sidebar_bg and unreadable in a narrow
                          # sidebar, so this goes much darker instead.
selection_bg = "#3d3222"  # cursor row - warm, picks up the amber accent
surface0 = "#313438"      # indent guide
surface1 = "#393b40"
surface_dim = "#43454a"   # method separators
text = "#bcbec4"
subtext0 = "#9da0a8"
overlay0 = "#7a7e85"      # comments
overlay1 = "#6f737a"
accent = "#ffc799"    # vesper primary - drives the selected tab + other highlights
red = "#f75464"
green = "#6aab73"
yellow = "#cf8e6d"
peach = "#cf8e6d"
blue = "#56a8f5"
teal = "#2aacb8"
mauve = "#c77dbb"

# Per-token styling wins over the theme. dim = false is the key part.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", fg = "#bcbec4", bold = true, dim = false }, { token = "tab", fg = "#6f737a", dim = false }],
  [{ token = "agent", fg = "#bcbec4", bold = true, dim = false }, { token = "state_text", dim = false, rules = [{ equals = "blocked", fg = "#f75464", bold = true }, { equals = "working", fg = "#cf8e6d" }, { equals = "done", fg = "#6aab73", bold = true }, { equals = "idle", fg = "#7a7e85" }, { equals = "unknown", fg = "#4b5059" }] }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "workspace", fg = "#bcbec4", bold = true, dim = false }, { token = "tab", fg = "#6f737a", dim = false }],
  [{ token = "terminal_title_stripped", fg = "#bcbec4", dim = false }],
  [{ token = "agent", fg = "#bcbec4", bold = true, dim = false }, { token = "state_text", dim = false, rules = [{ equals = "blocked", fg = "#f75464", bold = true }, { equals = "working", fg = "#cf8e6d" }, { equals = "done", fg = "#6aab73", bold = true }, { equals = "idle", fg = "#7a7e85" }, { equals = "unknown", fg = "#4b5059" }] }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [{ token = "$num", fg = "#ffc799", bold = true, dim = false }, { token = "workspace", fg = "#bcbec4", bold = true, dim = false }],
  [{ token = "branch", fg = "#9da0a8", dim = false }, { token = "git_status", fg = "#7a7e85", dim = false }],
]

[keys]
# switch_tab replaced by herdr-goto-tab custom commands below
focus_pane_left = ["alt+h", "alt+left"]
focus_pane_down = ["alt+j", "alt+down"]
focus_pane_up = ["alt+k", "alt+up"]
focus_pane_right = ["alt+l", "alt+right"]
new_tab = "alt+t"
next_tab = ["alt+tab", "ctrl+tab"]
previous_tab = "ctrl+shift+tab"
close_tab = "prefix+shift+x"
close_pane = "alt+x"
split_vertical = "alt+v"
split_horizontal = "alt+s"
zoom = "alt+z"
switch_workspace = "alt+1..9"
next_workspace = "alt+w"
previous_workspace = "alt+b"
new_workspace = ["alt+n", "prefix+shift+n"]
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"

# Ctrl+Alt+N: focus tab N, or create it when N is the next tab up. Herdr's own
# switch_tab cannot create a missing tab, hence the helper. (Plain alt+n is
# new_workspace, above.)
[[keys.command]]
key = "ctrl+alt+1"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 1"

[[keys.command]]
key = "ctrl+alt+2"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 2"

[[keys.command]]
key = "ctrl+alt+3"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 3"

[[keys.command]]
key = "ctrl+alt+4"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 4"

[[keys.command]]
key = "ctrl+alt+5"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 5"

[[keys.command]]
key = "ctrl+alt+6"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 6"

[[keys.command]]
key = "ctrl+alt+7"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 7"

[[keys.command]]
key = "ctrl+alt+8"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 8"

[[keys.command]]
key = "ctrl+alt+9"
type = "shell"
command = "__HOME__/.local/bin/herdr-goto-tab 9"


# Alt+Q: close workspace, and remove the worktree too if it is one.
[[keys.command]]
key = "alt+q"
type = "popup"
command = "__HOME__/.local/bin/herdr-close-workspace"
width = "70%"
height = "40%"

# Alt+C: close the focused tab, with a one-key confirmation.
[[keys.command]]
key = "alt+c"
type = "popup"
command = "__HOME__/.local/bin/herdr-close-tab"
width = "60%"
height = "30%"
