[main]
font=JetBrainsMono Nerd Font Mono:size=10
dpi-aware=yes

[scrollback]
lines=2000

[cursor]
style=block

[colors-dark]
# JetBrains "Dark" (PyCharm 2025.3, new UI) - extracted from
# app.jar!/themes/expUI/expUI_darkScheme.xml
foreground=bcbec4
background=000000
selection-foreground=bcbec4
selection-background=2e436e

regular0=1e1f22
regular1=f75464
regular2=6aab73
regular3=cf8e6d
regular4=56a8f5
regular5=c77dbb
regular6=2aacb8
regular7=bcbec4

bright0=4b5059
bright1=ff7a85
bright2=82c48a
bright3=e0a37f
bright4=7cbdff
bright5=d798cd
bright6=5cc2cc
bright7=dfe1e5

alpha=0.85

[bell]
urgent=no
notify=no
visual=no

[mouse]
hide-when-typing=yes

[text-bindings]
# Ctrl+Delete deletes the next word in every program: it sends Alt+D (Esc d),
# readline's "delete word forward". zsh already did this on Ctrl+Delete, but
# Claude Code's input box has no Ctrl+Delete of its own, so it gets Alt+D instead.
# nvim needs Alt+D mapped for it (nvim/plugin/foot-keys.lua, from neovim.sh):
# unmapped, it is Esc then d there, and the next keys run as commands.
\x1bd = Control+Delete
