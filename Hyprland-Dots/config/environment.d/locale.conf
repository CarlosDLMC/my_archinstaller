# Read by the systemd user session, so it reaches every app in the graphical
# session, not just interactive shells.
#
# Russian time locale: a 24-hour clock, a Monday-first calendar, and Cyrillic
# day and month names - which is what the Soviet theme wants. CalendarPopup.qml
# reads Qt.locale() for firstDayOfWeek and for its "MMMM yyyy" heading, and
# SovietLock.py sets LC_TIME to ru_RU for its own date line.
#
# Only LC_TIME is Russian. LANG stays whatever /etc/locale.conf sets
# (en_US.UTF-8), so interfaces remain in English and only dates and times are
# localised.
#
# install-scripts/locales.sh generates ru_RU.UTF-8. Without it glibc falls back
# to C silently and the clock quietly goes 12-hour.
LC_TIME=ru_RU.UTF-8
