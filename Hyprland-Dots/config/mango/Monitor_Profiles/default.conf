# Default monitor profile. MonitorProfiles.sh copies a file from this directory
# over ~/.config/mango/monitors.conf.
#
# monitor_rule=name:^NAME$,width:W,height:H,refresh:R,x:X,y:Y,scale:S,rr:T,vrr:0/1
# Anchor the name: it is a regex searched anywhere, so DP-1 would also match
# eDP-1. Without a rule an output gets its preferred mode, an automatic
# position and scale 1. When an output appears the FIRST matching rule
# applies, so rules for one output go above the catch-all at the end.
#
# Examples:
# monitor_rule=name:^eDP-1$,width:2560,height:1440,refresh:165,x:0,y:0,scale:1,vrr:1
# monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:240,scale:1,vrr:1
# QEMU-KVM, virtualbox or vmware:
# monitor_rule=name:^Virtual-1$,width:1920,height:1080,refresh:60
# disable a monitor:
# monitor_rule=name:^HDMI-A-1$,disable:1
# rotate (rr: 0 normal, 1 90°, 2 180°, 3 270°, 4-7 flipped):
# monitor_rule=name:^eDP-1$,rr:1

# Every other output: its preferred mode, VRR on.
monitor_rule=name:.*,vrr:1
