# Key, mouse, scroll and touchpad bindings.
#
#   bind[flags]=MODS,KEY,dispatcher[,args]
#   flags: e = repeats while the key is held (only these do), l = also works
#          on the lock screen, p = the key still reaches the focused app (and
#          is not repeated), r = on release
#   MODS: SUPER, CTRL, ALT, SHIFT joined with +, or NONE
#
# Keys resolve through the first layout (us), so every bind works the same in
# es and ru. The text after "  # " is the description: KeyHints.py (SUPER H)
# and KeyBinds.sh (SUPER SHIFT K) list the binds from this file with it, so
# give every bind one - and keep apostrophes out of these lines (an odd quote
# stops mango from cutting the comment off).
#
# A held key runs its bind once; only the binde ones repeat (volume,
# brightness, resizing), as on Hyprland (bind_repeat_flagged_only in
# settings.conf, a patch of pkgbuilds/mangowm).
# No commas inside a spawned command: mango splits the line at them.

var=S,~/.config/hypr/scripts
var=U,~/.config/hypr/UserScripts
var=bar,qs -c bar ipc call

# ---- Standard ----
bind=SUPER,d,spawn,$S/Launcher.sh  # app launcher
bind=SUPER,b,spawn,librewolf  # open browser
bind=SUPER,a,spawn,$bar overview toggle  # desktop overview
bind=SUPER,Return,spawn,$term  # open terminal
bind=SUPER,e,spawn,$files  # file manager

# ---- Features / extras ----
bind=SUPER,h,spawn,$S/KeyHints.sh  # cheat sheet (searchable list of keybinds)
bind=SUPER+ALT,r,spawn,$S/Refresh.sh  # refresh bar and menus
bind=SUPER+ALT,e,spawn,$S/RofiEmoji.sh  # emoji menu
bind=SUPER+CTRL,s,spawn,rofi -show window  # window switcher
bind=SUPER+ALT,o,spawn,$S/ChangeBlur.sh  # toggle blur
bind=SUPER+SHIFT,g,spawn,$S/GameMode.sh  # toggle game mode
bindl=SUPER+ALT,v,spawn,$bar clipboard toggle  # clipboard history
# The bar's cards from the keyboard (quickshell/bar/BarCards.qml): the card
# opens with its first control focused - arrows/Tab move, Enter or Space press,
# Esc closes; the same key again closes it too.
bind=SUPER+CTRL,a,spawn,$bar cards toggle audio  # audio card
bind=SUPER+CTRL,w,spawn,$bar cards toggle network  # network card
bind=SUPER+CTRL,p,spawn,$bar cards toggle power  # power card
bind=SUPER+CTRL,t,spawn,$bar cards toggle bluetooth  # control panel card (bluetooth)
bind=SUPER+CTRL,c,spawn,$bar cards toggle calendar  # calendar
bind=SUPER+CTRL,m,spawn,$bar cards toggle weather  # weather card
bind=SUPER+CTRL,v,spawn,$bar cards toggle vpn  # VPN card
bind=SUPER+CTRL,e,spawn,$bar cards toggle profile  # control panel card (power profile)
bind=SUPER+CTRL,g,spawn,$bar cards toggle battery  # battery card
bind=SUPER+CTRL,i,spawn,$bar cards toggle agent  # Claude Code card
bind=SUPER+CTRL,b,spawn,$S/RestartBar.sh  # restart quickshell

bind=SUPER+SHIFT,f,togglefullscreen  # fullscreen
bind=SUPER+CTRL,f,togglemaximizescreen  # maximize window
bindl=SUPER,space,spawn,$S/LayoutNext.sh  # switch keyboard layout
bind=SUPER+SHIFT,space,spawn,$S/FloatToggle.sh  # toggle floating (active window)
bind=SUPER+ALT,space,spawn,$S/FloatAll.sh  # float / tile every window on this workspace
bind=SUPER+SHIFT,Return,spawn,$S/Dropterminal.sh $term  # dropdown terminal
bind=SUPER+CTRL+ALT,b,spawn,$S/ToggleQuickshellBar.sh  # toggle quickshell bar on/off

# ---- Features / extras (UserScripts) ----
bind=SUPER+SHIFT,m,spawn,$U/RofiBeats.sh  # online music
# The wallpaper carousel in the quickshell bar (WallpaperOsd.qml). It applies
# through WallpaperSelect.sh, which run with no file is still the rofi menu.
bindl=SUPER,w,spawn,$bar wallpaper toggle  # select wallpaper
bind=SUPER+SHIFT,w,spawn,$U/WallpaperEffects.sh  # wallpaper effects
bind=CTRL+ALT,w,spawn,$U/WallpaperRandom.sh  # random wallpaper
bind=SUPER+SHIFT,k,spawn,$S/KeyBinds.sh  # search keybinds (rofi)
bind=SUPER+SHIFT,a,spawn,$S/Animations.sh  # animations menu

# Both press orders of ALT+SHIFT, so the gesture works whichever modifier lands
# first. Both go through the bar, which owns the MRU ordering and the OSD.
# The second one lets the key through to the app and is not repeated.
bindl=ALT,Shift_L,spawn,$S/LayoutNext.sh  # switch keyboard layout
bindlp=SHIFT,Alt_L,spawn,$S/LayoutNext.sh  # switch keyboard layout

bind=SUPER+ALT,c,spawn,$U/RofiCalc.sh  # calculator

# Move every window of the current workspace to the monitor in that direction
bind=SUPER+CTRL,F9,spawn,$S/MoveTagToMonitor.sh left  # move workspace to left monitor
bind=SUPER+CTRL,F10,spawn,$S/MoveTagToMonitor.sh right  # move workspace to right monitor
bind=SUPER+CTRL,F11,spawn,$S/MoveTagToMonitor.sh up  # move workspace to up monitor
bind=SUPER+CTRL,F12,spawn,$S/MoveTagToMonitor.sh down  # move workspace to down monitor

# ---- System ----
# Opens the power menu on ВЫХОД instead of exiting outright: Enter (or E) arms
# the five-second countdown, Esc backs out.
bind=CTRL+ALT,Delete,spawn,$bar power exit  # exit mango (asks first)
bind=SUPER,q,killclient  # close active window
bind=SUPER+SHIFT,q,spawn,$S/KillActiveProcess.sh  # kill active window process (force)
bind=CTRL+ALT,l,spawn,$S/LockScreen.sh  # lock screen
bind=SUPER+CTRL+ALT,l,spawn,$S/Screensaver.sh --lock  # screensaver, then lock screen
# Shutdown from the lock screen (press twice). It fires while working too, so
# the key still reaches the app, and LockPower.sh does nothing unless hyprlock
# is running.
bindlp=NONE,F1,spawn,$S/LockPower.sh key  # shutdown (on the lock screen, press twice)
bind=CTRL+ALT,p,spawn,$bar power toggle  # powermenu
# Every notification on screen closed at once, none of their actions run.
bind=SUPER,n,spawn,dunstctl close-all  # close all notifications
bind=SUPER+SHIFT,e,spawn,$S/Quick_Settings.sh  # quick settings menu

# ---- Layouts ----
# master layout (not used by default)
bind=SUPER+CTRL,d,incnmaster,-1  # remove master
bind=SUPER+CTRL,Return,zoom  # swap with master
# SUPER+J/K cycle windows the same way on every layout.
bind=SUPER,j,focusstack,next  # cycle next window
bind=SUPER,k,focusstack,prev  # cycle previous window
# dwindle
bind=SUPER+SHIFT,i,dwindle_toggle_current_split  # toggle split (dwindle)
bind=SUPER,m,spawn,$S/SplitRatio.sh  # set split ratio to 0.3
# ALT+Tab is left to the apps (herdr uses it); SUPER+J/K cycle windows.

# ---- Special keys ----
bindle=NONE,XF86AudioRaiseVolume,spawn,$S/Volume.sh --inc  # volume up
bindle=NONE,XF86AudioLowerVolume,spawn,$S/Volume.sh --dec  # volume down
bindlp=NONE,XF86AudioMicMute,spawn,$S/Volume.sh --toggle-mic  # toggle mic mute
bindlp=NONE,XF86AudioMute,spawn,$S/Volume.sh --toggle  # toggle mute
bindlp=NONE,XF86Sleep,spawn,systemctl suspend  # sleep
bindlp=NONE,XF86RFKill,spawn,$S/AirplaneMode.sh  # airplane mode
# Media controls. The play/pause key (keycode 172) sends XF86AudioPlay, and
# XF86AudioPause on its second level, so a keysym bind for Pause would fight
# the Play bind over that key; the separate pause key is bound by its keycode.
bindlp=NONE,XF86AudioPlay,spawn,$S/MediaCtrl.sh --pause  # play / pause
bindlp=NONE,code:209,spawn,$S/MediaCtrl.sh --pause  # play / pause
bindlp=NONE,XF86AudioNext,spawn,$S/MediaCtrl.sh --nxt  # next track
bindlp=NONE,XF86AudioPrev,spawn,$S/MediaCtrl.sh --prv  # previous track
bindlp=NONE,XF86AudioStop,spawn,$S/MediaCtrl.sh --stop  # stop

# ---- Screenshots ----
# Bare Print: instant shot of whichever monitor the pointer is on - the pointer
# and not the focused monitor, they can be on different screens. SUPER + Print
# is the same capture handed to satty first.
bind=NONE,Print,spawn,$S/ScreenShot.sh --mouse  # screenshot (monitor under pointer)
bind=SUPER,Print,spawn,$S/ScreenShot.sh --mouse --edit  # screenshot (monitor under pointer) - open in editor
bind=SUPER+SHIFT,Print,spawn,$S/ScreenShot.sh --area  # screenshot (area)
bind=SUPER+CTRL,Print,spawn,$S/ScreenShot.sh --in5  # screenshot in 5s
bind=SUPER+CTRL+SHIFT,Print,spawn,$S/ScreenShot.sh --in10  # screenshot in 10s
bind=ALT,Print,spawn,$S/ScreenShot.sh --active  # screenshot active window
bindl=SUPER+SHIFT,s,spawn,$bar shot open  # screenshot dialog
bind=SUPER+ALT,s,spawn,$S/ScreenShot.sh --area --edit  # screenshot area - open in editor

# ---- Screen recording ----
bindl=SUPER+SHIFT,r,spawn,$bar record open  # screen recording dialog
bind=SUPER+CTRL,r,spawn,$S/ScreenRecord.sh --fullscreen  # screen record (focused monitor)
bind=ALT,r,spawn,$S/ScreenRecord.sh --active  # screen record (active window)
bind=SUPER+CTRL+SHIFT,r,spawn,$S/ScreenRecord.sh --stop  # stop recording

# ---- Resize windows (repeat while held) ----
binde=SUPER+SHIFT,Left,resizewin,-50,+0  # resize left (-50)
binde=SUPER+SHIFT,Right,resizewin,+50,+0  # resize right (+50)
binde=SUPER+SHIFT,Up,resizewin,+0,-50  # resize up (-50)
binde=SUPER+SHIFT,Down,resizewin,+0,+50  # resize down (+50)

# ---- Move windows ----
bind=SUPER+CTRL,Left,move_client,left  # move window left
bind=SUPER+CTRL,Right,move_client,right  # move window right
bind=SUPER+CTRL,Up,move_client,up  # move window up
bind=SUPER+CTRL,Down,move_client,down  # move window down

# ---- Swap windows ----
bind=SUPER+ALT,Left,exchange_client,left  # swap window left
bind=SUPER+ALT,Right,exchange_client,right  # swap window right
bind=SUPER+ALT,Up,exchange_client,up  # swap window up
bind=SUPER+ALT,Down,exchange_client,down  # swap window down

# ---- Groups (tabs) ----
# As on Hyprland: SUPER+G makes the focused window a group of one, which the
# windows opened from it join as tabs; SUPER+G on a group breaks it up. Tab
# focus goes round from the last tab to the first.
bind=SUPER,g,grouptoggle  # toggle group
bind=SUPER,Tab,groupfocus,next  # next window in group
bind=SUPER+CTRL,Tab,groupfocus,prev  # previous window in group
bind=SUPER+SHIFT,Tab,groupmove,next  # move tab right in group
bind=SUPER+ALT,Tab,groupmove,prev  # move tab left in group
bind=SUPER+CTRL,k,groupjoin,left  # move window into the group on the left
bind=SUPER+CTRL,l,groupjoin,right  # move window into the group on the right
bind=SUPER,o,groupleave  # move window out of its group
bind=SUPER,u,spawn,$S/GroupJoin.sh  # join window into the workspace group

# ---- Move focus ----
bind=SUPER,Left,focusdir,left  # focus left
bind=SUPER,Right,focusdir,right  # focus right
bind=SUPER,Up,focusdir,up  # focus up
bind=SUPER,Down,focusdir,down  # focus down

# ---- Special workspace (scratchpad) ----
# SUPER+U is gamescope's (it toggles FSR upscaling in-game), so the toggle sits
# on SUPER+ALT+U.
bind=SUPER+SHIFT,u,tag_special_tag  # move to special workspace
bind=SUPER+ALT,u,toggle_special_tag  # toggle special workspace

# ---- Workspaces 1-10 on the number row (0 = 10) ----
bind=SUPER,1,view,1,0  # workspace 1
bind=SUPER,2,view,2,0  # workspace 2
bind=SUPER,3,view,3,0  # workspace 3
bind=SUPER,4,view,4,0  # workspace 4
bind=SUPER,5,view,5,0  # workspace 5
bind=SUPER,6,view,6,0  # workspace 6
bind=SUPER,7,view,7,0  # workspace 7
bind=SUPER,8,view,8,0  # workspace 8
bind=SUPER,9,view,9,0  # workspace 9
bind=SUPER,0,view,10,0  # workspace 10
bind=SUPER+SHIFT,1,tag,1,0  # move to workspace 1
bind=SUPER+SHIFT,2,tag,2,0  # move to workspace 2
bind=SUPER+SHIFT,3,tag,3,0  # move to workspace 3
bind=SUPER+SHIFT,4,tag,4,0  # move to workspace 4
bind=SUPER+SHIFT,5,tag,5,0  # move to workspace 5
bind=SUPER+SHIFT,6,tag,6,0  # move to workspace 6
bind=SUPER+SHIFT,7,tag,7,0  # move to workspace 7
bind=SUPER+SHIFT,8,tag,8,0  # move to workspace 8
bind=SUPER+SHIFT,9,tag,9,0  # move to workspace 9
bind=SUPER+SHIFT,0,tag,10,0  # move to workspace 10
bind=SUPER+CTRL,1,tagsilent,1  # move silently to workspace 1
bind=SUPER+CTRL,2,tagsilent,2  # move silently to workspace 2
bind=SUPER+CTRL,3,tagsilent,3  # move silently to workspace 3
bind=SUPER+CTRL,4,tagsilent,4  # move silently to workspace 4
bind=SUPER+CTRL,5,tagsilent,5  # move silently to workspace 5
bind=SUPER+CTRL,6,tagsilent,6  # move silently to workspace 6
bind=SUPER+CTRL,7,tagsilent,7  # move silently to workspace 7
bind=SUPER+CTRL,8,tagsilent,8  # move silently to workspace 8
bind=SUPER+CTRL,9,tagsilent,9  # move silently to workspace 9
bind=SUPER+CTRL,0,tagsilent,10  # move silently to workspace 10
# Every window of this workspace to workspace N, keeping its layout, and follow
bind=SUPER+ALT,1,spawn,$U/MoveWorkspaceWindows.py 1 --follow  # move all windows to workspace 1
bind=SUPER+ALT,2,spawn,$U/MoveWorkspaceWindows.py 2 --follow  # move all windows to workspace 2
bind=SUPER+ALT,3,spawn,$U/MoveWorkspaceWindows.py 3 --follow  # move all windows to workspace 3
bind=SUPER+ALT,4,spawn,$U/MoveWorkspaceWindows.py 4 --follow  # move all windows to workspace 4
bind=SUPER+ALT,5,spawn,$U/MoveWorkspaceWindows.py 5 --follow  # move all windows to workspace 5
bind=SUPER+ALT,6,spawn,$U/MoveWorkspaceWindows.py 6 --follow  # move all windows to workspace 6
bind=SUPER+ALT,7,spawn,$U/MoveWorkspaceWindows.py 7 --follow  # move all windows to workspace 7
bind=SUPER+ALT,8,spawn,$U/MoveWorkspaceWindows.py 8 --follow  # move all windows to workspace 8
bind=SUPER+ALT,9,spawn,$U/MoveWorkspaceWindows.py 9 --follow  # move all windows to workspace 9
bind=SUPER+ALT,0,spawn,$U/MoveWorkspaceWindows.py 10 --follow  # move all windows to workspace 10

bind=SUPER+SHIFT,bracketleft,tagtoleft,0  # move to previous workspace
bind=SUPER+SHIFT,bracketright,tagtoright,0  # move to next workspace
bind=SUPER+CTRL,bracketleft,spawn,$S/TagShift.sh prev  # move silently to previous workspace
bind=SUPER+CTRL,bracketright,spawn,$S/TagShift.sh next  # move silently to next workspace

# Step through workspaces: SUPER + wheel, SUPER + , / ., CTRL + ALT + arrows.
# The next number even when that workspace is empty; no wrap round.
axisbind=SUPER,DOWN,viewtoright,0  # next workspace
axisbind=SUPER,UP,viewtoleft,0  # previous workspace
bind=SUPER,period,viewtoright,0  # next workspace
bind=SUPER,comma,viewtoleft,0  # previous workspace
bind=CTRL+ALT,Left,viewtoleft,0  # previous workspace
bind=CTRL+ALT,Right,viewtoright,0  # next workspace

# ---- Desktop zoom: SUPER + ALT + wheel, around the cursor (1x to 10x) ----
axisbind=SUPER+ALT,UP,zoom_by,2.0  # zoom in
axisbind=SUPER+ALT,DOWN,zoom_by,0.5  # zoom out

# ---- Mouse: SUPER + left drag moves, SUPER + right drag resizes ----
mousebind=SUPER,btn_left,moveresize,curmove  # move window
mousebind=SUPER,btn_right,moveresize,curresize  # resize window

# ---- Touchpad (laptops) ----
# Three fingers sideways switch workspaces, three fingers up open the overview;
# four fingers up and down zoom in and out.
gesturebind=NONE,left,3,viewtoright,0  # next workspace (touchpad)
gesturebind=NONE,right,3,viewtoleft,0  # previous workspace (touchpad)
gesturebind=NONE,up,3,spawn,qs -c bar ipc call overview toggle  # desktop overview (touchpad)
gesturebind=NONE,up,4,zoom_by,1.5  # zoom in (touchpad)
gesturebind=NONE,down,4,zoom_by,0.6667  # zoom out (touchpad)

# ---- Your apps ----
bind=SUPER,t,spawn,Telegram  # Telegram
bind=SUPER,r,spawn,rustrover  # RustRover
bind=SUPER+CTRL,F8,spawn,$U/handy-toggle.sh  # toggle Handy dictation
