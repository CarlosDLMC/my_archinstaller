# ASUS laptop keys, only where rog.sh installed asusctl: elsewhere they named
# tools that are not there, and filled the cheat sheet with "ASUS Armoury
# Crate" and FN keys the keyboard does not have. scripts/MachineConf.sh sources
# this file from state/machine.conf on laptops with asusctl.

var=once,~/.config/hypr/scripts/Once.sh

bind=NONE,XF86Launch1,spawn,$once rog-control-center  # ASUS Armoury Crate
# asusctl 6.x spellings. The 5.x ones (`led-mode -n`, `profile -n`) are
# rejected outright by 6.x ("Unrecognized argument").
bind=NONE,XF86Launch3,spawn,$once asusctl aura effect --next-mode  # switch keyboard RGB profile (FN+F4)
bind=NONE,XF86Launch4,spawn,$once asusctl profile next  # cycle fan profile (FN+F5)
