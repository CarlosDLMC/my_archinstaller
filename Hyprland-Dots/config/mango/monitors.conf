# Output layout: monitor_rule=name:^NAME$,width:W,height:H,refresh:R,x:X,y:Y,scale:S
# Quick Settings > «Мониторы» (nwg-displays) and «Профиль мониторов»
# (MonitorProfiles.sh) overwrite this file; mango reloads when it changes.
#
# With no rule for it, an output gets its preferred mode (2560x1440@75 on the
# Samsung), an automatic position and scale 1. This catch-all rule only adds
# variable refresh rate on every output, always on: switching it per
# fullscreen window made the Samsung go black for ~2 s at every toggle.
# When an output appears the FIRST matching rule applies, so a rule for one
# output goes above this one (Monitor_Profiles/default.conf has examples).
monitor_rule=name:.*,vrr:1
