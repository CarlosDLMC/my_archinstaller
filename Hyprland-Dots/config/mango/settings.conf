# Input, layout, gaps, borders, blur, shadows and behaviour.
# The colours here are only the fallback for a fresh machine: wallust writes
# the real ones to wallust/colors.conf on every wallpaper change, and that file
# is sourced after this one (config.conf).

# ---- Keyboard ----
# Bind keys resolve through the FIRST layout, so SUPER+D, SUPER+1... hit the
# same physical keys whichever layout is active. Keep us first.
# layouts.py and SovietLockGen.py read the layout line below, keep it on one line
xkb_rules_layout=us,es,ru
# Right-side Super: the Menu / context-menu key acts as Super. It replaces the
# key's own context-menu function.
xkb_rules_options=altwin:menu_win
repeat_rate=50
repeat_delay=300
numlock_on=1

# ---- Mouse and touchpad ----
mouse_accel_speed=0.0
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_middle_button_emulation=0
tap_to_click=1
tap_and_drag=1
# mango's default is 1 (drag lock with a timeout); libinput's and Hyprland's is off
drag_lock=0
touch_enable=1

# ---- Focus ----
# Focus follows the pointer: entering a window focuses it.
sloppy_focus=1
# An app that asks to be activated gets focus, so a link clicked in Telegram
# brings LibreWolf forward. Apps also ask on new messages to get attention -
# turn that off in the app (Telegram: Settings > Notifications > "Draw attention
# to the window"; Slack and ZapZap on Linux never ask).
focus_on_activate=1
# Focus and swap moves continue onto the next monitor at the edge.
focus_cross_monitor=1
exchange_cross_monitor=1
# Middle click does not paste the primary selection.
disable_middle_paste=1

# ---- Cursor ----
# The black Adwaita cursor (the "default" XCursor theme), 24 px.
cursor_theme=default
cursor_size=24
# The pointer hides while typing and comes back when the mouse moves; it never
# hides on its own and is never warped to a window.
cursor_hide_on_keypress=1
cursor_hide_timeout=0
warp_cursor=0

# ---- Moving and resizing with the mouse ----
# SUPER + drag moves (left button) and resizes (right button), see keybinds.conf.
# A dragged tiled window keeps its size until it is dropped.
drag_tile_small=0
# Resizing by grabbing a window's edge works on the 1 px border only: mango's
# grab strip lies inside the window and would take clicks from scrollbars.
enable_border_resize=1
border_resize_size=0
enable_floating_snap=0

# ---- Workspaces (tags) ----
# Ten workspaces: SUPER + 0 is the tenth.
tag_num=10
# SUPER + the number of the workspace already shown goes back to the previous one.
view_current_to_back=1
# SUPER + wheel steps at most one workspace per 300 ms.
axis_bind_apply_timeout=300

# ---- Layout ----
# dwindle everywhere. A new window always splits the focused one to the right
# (wide) or below (tall), and the split directions of a tree are kept.
tag_rule=id:*,layout_name:dwindle
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1
dwindle_smart_split=0
# master layout (not bound, kept for completeness)
new_is_master=1
default_master_factor=0.5

# ---- Gaps ----
# 12 px between windows and at the screen edges, none under the bar: the bar's
# layer reserves 22 of its 34 px (quickshell/bar/shell.qml), and the 12 px
# outer gap fills the rest, so windows start right below the bar. mango only
# has one vertical outer gap for top and bottom; this is how the top gets 0.
gap_inner_horizontal=12
gap_inner_vertical=12
gap_outer_horizontal=12
gap_outer_vertical=12
smart_gaps=0

# ---- Special workspace (SUPER SHIFT U / SUPER ALT U) ----
# The rest of the screen dims 80%, and the windows on it get 80% of the work
# area, centred. These gaps give exactly that on 2560x1440; MachineConf.sh
# writes the values for the monitor of other machines into state/machine.conf.
special_dim=0.8
special_gap_outer_horizontal=266
special_gap_outer_vertical=151
special_gap_inner_horizontal=12
special_gap_inner_vertical=12

# The dropdown terminal is a named scratchpad (rules.conf); it comes to
# whichever monitor has focus.
scratchpad_cross_monitor=1

# ---- Borders ----
border_px=1
border_radius=0
no_border_when_single=0
# Fallback palette (wallust's colour12 / colour10 replace these). Every state
# colour that mango shows on the focused window is the focused colour, so a
# pinned, maximized or scratchpad window looks like any other focused one.
focus_color=0x067263ff
border_color=0x033530ff
urgent_color=0x033530ff
scratchpad_color=0x067263ff
global_color=0x067263ff
overlay_color=0x067263ff
maximized_screen_color=0x067263ff
# Behind everything, where no wallpaper is drawn (e.g. in game mode).
root_color=0x111111ff

# ---- Opacity ----
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# ---- Shadows ----
# A thin 3 px shadow around every window, tiled ones too, in the inactive
# border colour (wallust/colors.conf). mango has one shadow colour for all
# windows and fixes it when a window opens.
shadows=1
shadow_only_floating=0
layer_shadows=0
shadows_size=3
shadows_blur=3
shadows_position_x=-3
shadows_position_y=-3
shadows_color=0x033530ff

# ---- Blur ----
# Behind every translucent window and behind the bar and the quickshell
# surfaces (layer rules in rules.conf turn it off where Hyprland had none).
# blur_optimized=0: floating windows and the quickshell surfaces blur what is
# really behind them (the wallpaper carousel blurs the windows under it).
blur=1
blur_layer=1
blur_optimized=0
blur_params_radius=6
blur_params_num_passes=2
blur_params_noise=0.0117
blur_params_contrast=0.8916
blur_params_brightness=1.0
blur_params_saturation=1.0

# ---- Tab groups (SUPER G) ----
# A faint black tint over the wallpaper, white titles, square, sitting directly
# on the window. The tint follows the wallpaper's brightness:
# state/group-tint.conf, written by WallustSwww.sh, replaces the two
# background colours below (25% / 12.5% black up to a brightness of 0.30,
# rising to 60% / 45% at 0.70).
# Hyprland drew the titles 18 px high: 13.5 pt at mango's 96 dpi.
group_bar_height=23
group_bar_decorate_font_desc=Sans Medium 13.5
group_bar_decorate_focus_fg_color=0xffffffff
group_bar_decorate_fg_color=0xffffff90
group_bar_decorate_focus_bg_color=0x00000040
group_bar_decorate_bg_color=0x00000020
# The border colour is painted under the tab fill even at width 0, so it has
# to be fully transparent for the tint to show the wallpaper.
group_bar_decorate_border_width=0
group_bar_decorate_border_color=0x00000000
group_bar_decorate_corner_radius=0
group_bar_decorate_padding_x=4
group_bar_decorate_padding_y=0
group_bar_close_button_enable=0
always_show_group_bar=0
monocle_tab_mode=0
deck_tab_mode=0

# ---- Fullscreen, dialogs, XWayland ----
# Floating windows stay below the bar and fullscreen windows, as before.
float_full_to_top=0
# XWayland apps are not scaled by the compositor (they get the real pixels).
xwayland_ignore_scale=1

# ---- Touchpad gestures (laptops) ----
gesture_swipe_distance=500
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=30
