# Environment for everything mango starts: env=NAME,value (the value is the
# rest of the line, commas included). Set again on every reload; a line that is
# removed is not unset until the next login.
#
# Not set here on purpose:
# - XDG_CURRENT_DESKTOP: mango sets it to "mango" itself and exports it, with
#   WAYLAND_DISPLAY and MANGO_INSTANCE_SIGNATURE, to D-Bus activation and the
#   systemd user session (the portals pick mango-portals.conf from it).
# - The NVIDIA variables: they depend on the machine, so they are written to
#   state/machine.conf by scripts/MachineConf.sh (see that file).

# The default editor (the terminal and file manager are in defaults.conf).
env=EDITOR,vim

# Locale for time/date formatting (Monday start, DD/MM/YYYY, 24-hour)
env=LC_TIME,ru_RU.UTF-8

# Version of the upstream dotfiles this config originally started from
env=DOTS_VERSION,2.3.19

# Toolkit backends
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=CLUTTER_BACKEND,wayland
# Run SDL2 applications on Wayland. Remove or set to x11 if games that ship
# older SDL versions misbehave.
# env=SDL_VIDEODRIVER,wayland

# XDG
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# Qt
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,qt6ct
# The Qt Quick Controls style from hyprland-qt-support. It is only a QML style
# (no compositor involved); kept so Qt Quick apps look as they always did.
env=QT_QUICK_CONTROLS_STYLE,org.hyprland.style

# XWayland scale (the same value as the monitor scale; 1 = 100%)
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1

# Firefox / LibreWolf
env=MOZ_ENABLE_WAYLAND,1

# Electron > 28 (auto picks Wayland if possible, X11 otherwise)
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# No direct scanout. With it the Samsung went black for about two seconds on
# every fullscreen toggle (mpv): the fullscreen surface was scanned out on its
# own and the output did a full modeset. Same as render:direct_scanout = 0 on
# Hyprland. Read when mango starts, so it needs a new login to change.
env=WLR_SCENE_DISABLE_DIRECT_SCANOUT,1
