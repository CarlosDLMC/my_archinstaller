# Laptop keys. Sourced only on laptops: scripts/MachineConf.sh writes the
# source line into state/machine.conf when there is a battery or the chassis
# is portable. Same flags and descriptions as keybinds.conf.

var=S,~/.config/hypr/scripts
var=once,~/.config/hypr/scripts/Once.sh

# Brightness (repeat while held)
bind=NONE,XF86KbdBrightnessDown,spawn,$S/BrightnessKbd.sh --dec  # decrease keyboard brightness
bind=NONE,XF86KbdBrightnessUp,spawn,$S/BrightnessKbd.sh --inc  # increase keyboard brightness
bind=NONE,XF86MonBrightnessDown,spawn,$S/Brightness.sh --dec  # decrease monitor brightness
bind=NONE,XF86MonBrightnessUp,spawn,$S/Brightness.sh --inc  # increase monitor brightness
bind=NONE,XF86TouchpadToggle,spawn,$once $S/TouchPad.sh  # toggle touchpad

# Screenshots on F6 (keyboards without a PrtSc key)
bind=SUPER,F6,spawn,$once $S/ScreenShot.sh --now  # screenshot
bind=SUPER+SHIFT,F6,spawn,$once $S/ScreenShot.sh --area  # screenshot (area)
bind=SUPER+CTRL,F6,spawn,$once $S/ScreenShot.sh --in5  # screenshot (5 secs delay)
bind=SUPER+ALT,F6,spawn,$once $S/ScreenShot.sh --in10  # screenshot (10 secs delay)
bind=ALT,F6,spawn,$once $S/ScreenShot.sh --active  # screenshot (active window only)
