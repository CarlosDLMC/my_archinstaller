# Window rules and layer rules.
#
# window_rule=key:value,...,app_id:<regex>,title:<regex>
# - app_id is the Wayland app id, or the WM_CLASS class of an X11 window.
# - The regexes are PCRE and search anywhere in the name, so every one here is
#   anchored ^...$ (Hyprland matched whole names). (?!...) excludes a title.
# - No commas inside a rule (no {m,n}), 255 bytes per line at most.
# - Rules apply when a window opens, top to bottom; the last match wins per key.
#   They are not re-applied when a title changes or the config reloads.
# - width/height: below 1 is a fraction of the whole monitor, above 1 pixels.
# - Floating windows open centred unless a rule moves them.

# ---- Every window ----
# Only tiled windows are told they are tiled, so floating GTK dialogs keep
# their own rounded corners and shadow.
window_rule=force_tiled_state:0,app_id:.*

# ---- Terminals ----
# foot's own alpha=0.85 does the base translucency (it dims only the
# background, so glyphs stay crisp); this adds only the focus differential:
# 0.85 focused, 0.85 x 0.82 = 0.70 unfocused.
window_rule=focused_opacity:1.0,unfocused_opacity:0.82,app_id:^(Alacritty|foot|dropterm)$
# omawrite (the omarchy_apps option), built the same way: its page is 90%
# opaque with crisp text, this adds 0.90 x 0.89 = 0.80 unfocused.
window_rule=focused_opacity:1.0,unfocused_opacity:0.89,app_id:^(omawrite)$
# The dropdown terminal (SUPER SHIFT Return, hypr/scripts/Dropterminal.sh): a
# named scratchpad, which mango slides down from above the screen and back up.
# 65% of the monitor wide and high, its top at 10% of the height - offset_y is
# a share of the free space above the centred window, and -52 lands there on
# 1440p and 1080p alike.
window_rule=is_named_scratchpad:1,width:0.65,height:0.65,offset_y:-52,app_id:^(dropterm)$

# ---- Settings and tools: floating, 70% x 70% ----
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(wihotspot(-gui)?|[Bb]aobab|org.gnome.[Bb]aobab|gnome-disks)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(file-roller|org.gnome.FileRoller|nm-applet|nm-connection-editor|blueman-manager)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(qt5ct|qt6ct|[Yy]ad|xdg-desktop-portal-gtk)$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^(org.kde.polkit-kde-authentication-agent-1|[Rr]ofi)$
window_rule=is_floating:1,width:0.7,height:0.7,title:^(ROG Control|Kvantum Manager)$
# Wallpaper tools
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^([Ww]aytrogen)$
# wdisplays / nwg-look, floating at their own size
window_rule=is_floating:1,app_id:^(network.cycles.wdisplays|wdisplays|nwg-look)$
window_rule=is_floating:1,title:^(Hyprland Settings)$

# ---- Viewers ----
window_rule=is_floating:1,app_id:^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
window_rule=is_floating:1,app_id:^(evince|eog|org.gnome.Loupe)$

# ---- Keybind cheat sheet (SUPER H, scripts/KeyHints.py) ----
window_rule=is_floating:1,width:0.65,height:0.9,app_id:^(hypr-cheat-sheet)$
window_rule=is_floating:1,width:0.65,height:0.9,title:^(Quick Cheat Sheet)$

# ---- Other floating apps ----
window_rule=is_floating:1,app_id:^([Zz]oom|onedriver|onedriver-launcher)$
window_rule=is_floating:1,app_id:^(org.gnome.Calculator)$,title:^(Calculator)$
window_rule=is_floating:1,app_id:^(mpv|com.github.rafostar.Clapper)$
window_rule=is_floating:1,app_id:^([Qq]alculate-gtk)$
window_rule=is_floating:1,width:0.6,height:0.7,app_id:^([Ff]erdium)$
# ZapZap / WhatsApp tile; the size is used when one is floated by hand.
window_rule=width:0.6,height:0.7,app_id:^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
window_rule=is_floating:1,app_id:^(com.gabm.satty)$

# Picture-in-Picture: floating, on every workspace, near the top-right corner
# (where Hyprland put it at 72% / 7% for a 640x360 player).
window_rule=is_floating:1,is_global:1,offset_x:93,offset_y:-87,title:^(Picture-in-Picture)$

# ---- Dialogs ----
window_rule=is_floating:1,title:^(Authentication Required)$
window_rule=is_floating:1,width:0.7,height:0.6,title:^(Add Folder to Workspace|Save As|Open Files)$
# The YAD dialog for the SDDM background
window_rule=is_floating:1,width:0.16,height:0.12,title:^(SDDM Background)$
# Dialogs of apps whose main window carries the app's name in its title.
window_rule=is_floating:1,app_id:^(codium|codium-url-handler|VSCodium)$,title:^(?!.*(codium|VSCodium)).*$
window_rule=is_floating:1,app_id:^(com.heroicgameslauncher.hgl)$,title:^(?!Heroic Games Launcher$).*$
window_rule=is_floating:1,app_id:^([Ss]team)$,title:^(?![Ss]team$).*$
# Thunar's rename, properties, bulk-rename and file-transfer dialogs are
# separate toplevels with the browser window's app id, so they would tile and
# take half the screen. Only the browser window's title ends in "- Thunar".
window_rule=is_floating:1,app_id:^([Tt]hunar)$,title:^(?!.* - Thunar$).*$

# ---- JetBrains ----
# Every JetBrains window floats, then the main editor (its title has the
# project path, "[~/...") tiles again. The hover popups (titles win0, win1...)
# open without taking the focus.
window_rule=is_floating:1,app_id:^(jetbrains-.+)$
window_rule=is_floating:0,app_id:^(jetbrains-.+)$,title:^(.*\[~/.*)$
window_rule=is_open_silent:1,app_id:^(jetbrains-.*)$,title:^(win[0-9]+)$

# ---- Media and games ----
window_rule=no_blur:1,app_id:^([Mm]pv|vlc)$
window_rule=no_blur:1,is_fullscreen:1,app_id:^(gamescope|steam_app_\d+)$

# ---- Screensaver (scripts/Screensaver.sh) ----
# Floating, so it never takes a slot in the layout (the other windows would
# grow back into place behind it when it closes), and no open or close
# animation: shrinking away would uncover the bare wallpaper for a moment.
window_rule=is_floating:1,no_animation:1,animation_type_open:none,animation_type_close:none,no_fade_in:1,no_fade_out:1,app_id:^(screensaver)$

# The launcher's preview mode (rofi's ФАЙЛЫ tab, Shift+Enter) adds its rule
# while it is on: scripts/RofiPreviewMode.sh.


# ---- Layer rules ----
# layer_rule=key:value,...,layer_name:<regex>
# Blur is on for every top/overlay surface (blur_layer=1). Hyprland blurred
# only the bar, the wallpaper carousel, the overview and the bar's cards
# (popups); every other namespace - notifications, rofi, the bar's other
# dialogs, slurp, hyprpicker... - gets none.
layer_rule=no_blur:1,layer_name:^(?!quickshell:(bar|wallpaper|overview|card)).*$
# These appear at once, with no fade.
layer_rule=no_animation:1,layer_name:^(notifications|quickshell:crt)$
# The bar's own surfaces animate themselves.
layer_rule=no_animation:1,layer_name:^quickshell(:(bar|osd|wallpaper-reveal))?$
