# mango (mangowm) configuration - the desktop that used to be Hyprland.
# https://github.com/mangowm/mango (docs/ in the source tree)
#
# Format: key=value, one per line. A '#' only starts a comment at the beginning
# of a line or after whitespace, and an indented comment line is an error.
# Colours are always 8 hex digits, 0xRRGGBBAA. Booleans are 1/0 ("true" is 0).
# A value holds at most 255 bytes - long commands live in scripts.
#
# mango watches this file and every file it sources (auto_reload_config=1),
# so saving one reloads the config. A reload re-reads everything from the
# compiled-in defaults, so the order below matters: the last value wins.
#
# Check a change before saving it over the live file:
#   mango -c ~/.config/mango/config.conf -p
#
# What lives where:
#   defaults.conf     your default terminal, file manager and search engine
#   env.conf          environment for everything mango starts
#   settings.conf     input, layout, gaps, borders, blur, shadows, misc
#   animations.conf   window, workspace and layer animations
#   rules.conf        window rules and layer rules
#   keybinds.conf     every key, mouse and scroll binding (with descriptions)
#   startup.conf      programs started once at login
#
# Files written by scripts and installers, all optional:
#   monitors.conf           output layout (nwg-displays writes it)
#   wallust/colors.conf     border colours from the wallpaper (wallust)
#   state/group-tint.conf   tab-bar tint from the wallpaper's brightness
#   state/machine.conf      laptop keys, NVIDIA environment, special-workspace
#                           size - and, last, this session's runtime switches
#                           on the tmpfs: blur toggle, game mode, touchpad
#                           (scripts/MachineConf.sh writes it at login)

source=./defaults.conf
source=./env.conf
source=./settings.conf
source=./animations.conf
source=./rules.conf
source=./keybinds.conf
source=./startup.conf

source_optional=./monitors.conf
source_optional=./wallust/colors.conf
source_optional=./state/group-tint.conf
source_optional=./state/machine.conf
