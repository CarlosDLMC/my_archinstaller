# Animation preset "Mahaveer - me-2", converted from the Hyprland preset of the same name.
# name "Me-2"
# credit https://github.com/mahaveergurjar
# Picked from the animations menu (SUPER+SHIFT+A), which copies it over
# ~/.config/mango/animations.conf. See that file for what each line does.

animations=1

# Windows opening
animation_type_open=slide
animation_duration_open=500
animation_curve_open=0.1,1,0.1,1

# Windows closing
animation_type_close=slide
animation_duration_close=300
animation_curve_close=0.5,0,0.99,0.99

# Moves and resizes
animation_duration_move=500
animation_curve_move=0.05,0.9,0.1,1

# Fades (each lasts as long as its open or close)
animation_fade_in=1
fade_in_begin_opacity=0.0
animation_curve_opacity_fade_in=0.5,0,0.99,0.99
animation_fade_out=1
fade_out_begin_opacity=1.0
animation_curve_opacity_fade_out=0.5,0,0.99,0.99

# Focus change: opacity and border colour
animation_duration_focus=300
animation_curve_focus=0.5,0,0.99,0.99

# Workspace switch
tag_animation_direction=1
animation_duration_tag=500
animation_curve_tag=0.1,1,0.1,1

# Layer surfaces (rofi, the bar's cards)
layer_animations=1
layer_animation_type_open=fade
layer_animation_type_close=fade
