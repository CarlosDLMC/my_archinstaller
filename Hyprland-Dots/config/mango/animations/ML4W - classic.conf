# Animation preset "ML4W - classic", converted from the Hyprland preset of the same name.
# name "Classic"
# credit https://github.com/mylinuxforwork/dotfiles
# Picked from the animations menu (SUPER+SHIFT+A), which copies it over
# ~/.config/mango/animations.conf. See that file for what each line does.

animations=1

# Windows opening
animation_type_open=zoom
zoom_initial_ratio=0.8
animation_duration_open=700
animation_curve_open=0.05,0.9,0.1,1

# Windows closing
animation_type_close=zoom
zoom_end_ratio=0.8
animation_duration_close=700
animation_curve_close=0,0.75,0.15,1

# Moves and resizes
animation_duration_move=700
animation_curve_move=0.05,0.9,0.1,1

# Fades (each lasts as long as its open or close)
animation_fade_in=1
fade_in_begin_opacity=0.0
animation_curve_opacity_fade_in=0,0.75,0.15,1
animation_fade_out=1
fade_out_begin_opacity=1.0
animation_curve_opacity_fade_out=0,0.75,0.15,1

# Focus change: opacity and border colour
animation_duration_focus=700
animation_curve_focus=0,0.75,0.15,1

# Workspace switch
tag_animation_direction=1
animation_duration_tag=600
animation_curve_tag=0,0.75,0.15,1

# Layer surfaces (rofi, the bar's cards)
layer_animations=1
layer_animation_type_open=fade
layer_animation_type_close=fade
