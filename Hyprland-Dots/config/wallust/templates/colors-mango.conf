# wallust template - colors-mango.conf
# Rendered by wallust to ~/.config/mango/wallust/colors.conf on every wallpaper
# change. ~/.config/mango/config.conf sources it after settings.conf, and mango
# reloads by itself when it changes. Colours are 0xRRGGBBAA.
#
# colour12 borders the focused window, colour10 every other one (and the group
# tabs' windows). Every state colour mango shows on the focused window - pinned,
# maximized, scratchpad - is the focused colour, as on Hyprland. The shadow has
# one colour for all windows in mango: the inactive one, which most windows are.
focus_color=0x{{color12 | strip}}ff
scratchpad_color=0x{{color12 | strip}}ff
global_color=0x{{color12 | strip}}ff
overlay_color=0x{{color12 | strip}}ff
maximized_screen_color=0x{{color12 | strip}}ff
border_color=0x{{color10 | strip}}ff
urgent_color=0x{{color10 | strip}}ff
shadows_color=0x{{color10 | strip}}ff
