# Packages allowed to build with makepkg's --skipchecksums.
#
# WHAT ADDING A NAME HERE DOES
#
# When an AUR build fails with "One or more files did not pass the validity
# check!", the installer normally stops on that package and tells you to look
# at it. For a package listed here it instead rebuilds it with source integrity
# verification TURNED OFF, and carries on unattended.
#
# An entry is a name and the version that was checked, as makepkg prints them
# in "==> Making package: <name> <version>" (pkgver-pkgrel, with any epoch).
# The name may be the package name or its pkgbase - for a split PKGBUILD (one
# base building several packages) makepkg reports the base, and the installer
# checks both. Only that version is let through: a later one whose checksum
# fails stops the run again until someone has checked its source too.
#
# WHY THAT IS NOT AUTOMATIC FOR EVERYTHING
#
# A checksum mismatch means the bytes that were downloaded are not the bytes
# the AUR maintainer checksummed. Almost always that is a forge regenerating a
# release tarball - same source, different archive bytes. But it is also
# exactly what a tampered-with tarball looks like, and nothing in the failure
# itself tells the two apart. A PKGBUILD's build() runs as your user, and on a
# machine with nopasswd_sudo that is effectively root, so the difference
# matters.
#
# BEFORE YOU ADD A NAME
#
# Check the source really is unchanged, then record why in a comment:
#
#   1. yay -G <pkg>                        # fetch the PKGBUILD, do not build
#   2. makepkg -o --skipchecksums          # download + extract only
#   3. git clone <upstream> && git checkout <the tag the PKGBUILD pins>
#   4. diff -r src/<pkg>-<ver> <clone>     # must be identical apart from VCS metadata
#
# One "<name> <version>" per line. Blank lines and # comments are ignored.
# Remove an entry once upstream refreshes its checksum - it then does nothing
# except keep integrity off for a package that no longer needs it.

# wallust - hosted on Codeberg, which regenerates its release tarballs from
# time to time, so the sha256 pinned in the AUR PKGBUILD stops matching while
# the source itself is unchanged. Verified against the upstream 3.5.2 git tag
# on 2026-09-13. See README, "Validating source files with sha256sums FAILED".
wallust 3.5.2-1
