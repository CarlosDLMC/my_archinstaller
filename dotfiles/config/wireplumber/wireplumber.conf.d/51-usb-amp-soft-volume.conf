# XY-C50H amplifier (JieLi BR21 USB sound card).
# Its USB volume control is fake (range 0 dB..0 dB) and the firmware ignores
# it, so the bar's volume slider did nothing. Make PipeWire change the volume
# in software for this card instead, and show it as S30_CCCP.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-ZhuHai_JieLi_Technology_JieLi_BR21*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        device.description = "S30_CCCP"
      }
    }
  }
  # Show it by the name it has over Bluetooth instead of "JieLi BR21".
  {
    matches = [
      { node.name = "~alsa_output.usb-ZhuHai_JieLi_Technology_JieLi_BR21*" }
    ]
    actions = {
      update-props = {
        node.description = "S30_CCCP"
        node.nick = "S30_CCCP"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-ZhuHai_JieLi_Technology_JieLi_BR21*" }
    ]
    actions = {
      update-props = {
        node.description = "S30_CCCP Input"
        node.nick = "S30_CCCP Input"
      }
    }
  }
]
