# Mic noise suppression (RNNoise), run by filter-chain.service.
#
# A WirePlumber "smart filter": it is not a separate microphone to pick. It
# sits in front of whatever the default input is, and every application that
# records from the mic - wf-recorder, browsers, OBS - is routed through it
# automatically. The audio card in the bar keeps choosing real devices.
#
# Turn it off for a moment:  systemctl --user stop filter-chain.service
# The plugin is noise-suppression-for-voice (/usr/lib/ladspa).
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Mic noise suppression"
            media.name       = "Mic noise suppression"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            # Below this voice probability the output is
                            # silence: the hiss between words goes, speech stays.
                            "VAD Threshold (%)"          = 50.0
                            # Keep the gate open this long after speech, so
                            # word endings are not clipped.
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.mic_denoise"
                # Does not hold the microphone open on its own: the mic only
                # runs while something is recording through the filter.
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name         = "mic_denoise"
                media.class       = Audio/Source
                audio.rate        = 48000
                filter.smart      = true
                filter.smart.name = "mic-denoise"
            }
        }
    }
]
