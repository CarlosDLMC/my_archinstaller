# Desktop notifications for agents that finish or get blocked while the herdr
# window is not focused - see agent-notify.py. Linked by
# install-scripts/herdr.sh (herdr plugin link ~/.config/herdr/agent-notify).
id = "agent-notify"
name = "Agent notify"
description = "Notify through dunst when an agent finishes or is blocked and herdr is not the focused window"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "agent-notify.py"]
