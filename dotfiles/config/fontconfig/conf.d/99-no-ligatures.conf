<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Ask harfbuzz to turn off the ligature/contextual-alternate features.
       Honoured by Pango/GTK apps; browsers ignore it, hence the swaps below. -->
  <match target="font">
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
      <string>clig off</string>
      <string>calt off</string>
      <string>dlig off</string>
    </edit>
  </match>

  <!-- JetBrains Mono -> JetBrains Mono NL (the shipped no-ligature cut) -->
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrains Mono NL</string>
    </edit>
  </match>

  <!-- Fira Code has no NL cut; fall back to the ligature-free JetBrains NL -->
  <match target="pattern">
    <test name="family"><string>Fira Code</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrains Mono NL</string>
    </edit>
  </match>

</fontconfig>
