[Settings]
# GTK4 apps that do not link libadwaita (pavucontrol, for one) ignore both
# gsettings color-scheme and the xdg-desktop-portal appearance setting, and
# they never read ~/.config/gtk-3.0/settings.ini either. Without this line
# they fall back to GTK4's built-in Adwaita, which is light.
gtk-application-prefer-dark-theme=1
