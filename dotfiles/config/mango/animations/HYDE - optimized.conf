# Animation preset "HYDE - optimized", converted from the Hyprland preset of the same name.
# name "Optimized"
# credit https://github.com/prasanthrangan/hyprdots
# Picked from the animations menu (SUPER+SHIFT+A), which copies it over
# ~/.config/mango/animations.conf. See that file for what each line does.

animations=1

# Windows opening
animation_type_open=slide
animation_duration_open=320
animation_curve_open=0.07,0.88,0.04,0.99

# Windows closing
animation_type_close=zoom
zoom_end_ratio=0.8
animation_duration_close=280
animation_curve_close=0,0.48,0.38,1

# Moves and resizes
animation_duration_move=300
animation_curve_move=0.05,0.85,0.03,0.97

# Fades (each lasts as long as its open or close)
animation_fade_in=1
fade_in_begin_opacity=0.0
animation_curve_opacity_fade_in=0.05,0.8,0.1,0.97
animation_fade_out=1
fade_out_begin_opacity=1.0
animation_curve_opacity_fade_out=0.05,0.8,0.1,0.97

# Focus change: opacity and border colour
animation_duration_focus=180
animation_curve_focus=0.05,0.8,0.1,0.97

# Workspace switch
tag_animation_direction=1
animation_duration_tag=400
animation_curve_tag=0.05,0.82,0,1

# Layer surfaces (rofi, the bar's cards)
layer_animations=1
layer_animation_type_open=slide
layer_animation_type_close=fade
