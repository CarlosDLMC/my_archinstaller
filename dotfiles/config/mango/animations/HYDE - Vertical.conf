# Animation preset "HYDE - Vertical", converted from the Hyprland preset of the same name.
# name "Vertical"
# credit https://github.com/prasanthrangan/hyprdots
# Picked from the animations menu (SUPER+SHIFT+A), which copies it over
# ~/.config/mango/animations.conf. See that file for what each line does.

animations=1

# Windows opening
animation_type_open=zoom
zoom_initial_ratio=0.6
animation_duration_open=150
animation_curve_open=0.37,0,0.63,1

# Windows closing
animation_type_close=zoom
zoom_end_ratio=0.6
animation_duration_close=150
animation_curve_close=0.33,1,0.68,1

# Moves and resizes
animation_duration_move=150
animation_curve_move=0.37,0,0.63,1

# Fades (each lasts as long as its open or close)
animation_fade_in=1
fade_in_begin_opacity=0.0
animation_curve_opacity_fade_in=0,0.2,0.4,1
animation_fade_out=1
fade_out_begin_opacity=1.0
animation_curve_opacity_fade_out=0,0.2,0.4,1

# Focus change: opacity and border colour
animation_duration_focus=250
animation_curve_focus=0,0.2,0.4,1

# Workspace switch
tag_animation_direction=0
animation_duration_tag=300
animation_curve_tag=0,0.2,0.4,1

# Layer surfaces (rofi, the bar's cards)
layer_animations=1
layer_animation_type_open=zoom
layer_animation_type_close=zoom
