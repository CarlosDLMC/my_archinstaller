# Programs started once at login (exec_once; a config reload does not run
# them again). Each line goes through sh -c. mango runs exec= lines again on
# every reload AND on every runtime option change (game mode, the blur toggle),
# so they would restart things - the one exec= line, at the end, is there for
# exactly that.
#
# mango exports WAYLAND_DISPLAY, XDG_CURRENT_DESKTOP and the rest to D-Bus and
# the systemd user session itself, and starts graphical-session.target.

# First login only: wallust, themes, the first wallpaper (see the script).
exec_once=~/.config/hypr/initial-boot.sh

# Per-machine settings (laptop keys, NVIDIA environment, special-workspace size)
# written to state/machine.conf; mango reloads when the file changes.
exec_once=~/.config/hypr/scripts/MachineConf.sh

# Wallpaper: awww, or mpvpaper when a video was picked (WallpaperSelect.sh
# records the choice in ~/.config/hypr/wallpaper_effects/.wallpaper_video).
exec_once=~/.config/hypr/scripts/WallpaperStart.sh

# Polkit agent: the bar is the agent (rust-bar's polkit.rs); Polkit.sh exits
# at once then, and starts a fallback agent only without it.
exec_once=~/.config/hypr/scripts/Polkit.sh

exec_once=dunst

# The bar (rust-bar, built from the repo's rust-bar/ crate). ~/.cache/rust-bar
# first: the bar watches its timezone and weather files there, and a watch on
# a file whose folder does not exist yet never attaches. rust-bar is the last
# command, so the shell execs it and the process is plain "rust-bar" for the
# pkill pattern in RestartBar.sh.
exec_once=mkdir -p "$HOME/.cache/rust-bar"; rust-bar

# Clipboard history. -max-items goes BEFORE the subcommand (cliphist's flag
# parsing stops at the first positional argument, so after it the cap is
# silently ignored). 50 items: the cap counts items, not bytes, and at the
# default 750 the database had grown to 123MB. Both watchers share one
# database, so they must carry the same number.
exec_once=wl-paste --type text --watch cliphist -max-items 50 store
exec_once=wl-paste --type image --watch cliphist -max-items 50 store

# Size the lock screen for whatever monitors are attached. Also run before
# each lock, but doing it at login means a bare `hyprlock` is covered too.
exec_once=python3 ~/.config/hypr/scripts/SovietLockGen.py

# Keep this session's log readable after logout (ly truncates its own).
exec_once=~/.config/hypr/scripts/SessionLogKeep.sh

# Idle: the screensaver after 9 minutes (hypridle.conf).
exec_once=hypridle

# Night light back on if it was on in the last session.
exec_once=~/.config/hypr/scripts/NightLight.sh init

# Screensaver art sized for this screen, for each image that never had any.
# A few seconds in, once the session has settled: it measures a fullscreen foot.
exec_once=sleep 5; ~/.config/hypr/scripts/ScreensaverArt.sh --new

# A warning when no VPN is up.
exec_once=~/.config/hypr/UserScripts/vpn-reminder.sh

# Handy dictation at login (off by default):
# exec_once=~/.config/hypr/UserScripts/handy-start.sh

