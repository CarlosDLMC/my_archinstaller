# Output layout: monitor_rule=name:^NAME$,width:W,height:H,refresh:R,x:X,y:Y,scale:S
# Quick Settings > «Мониторы» opens this file; «Мониторы (wdisplays)» tries a
# layout live, for this session only; «Профиль мониторов» (MonitorProfiles.sh)
# copies a saved profile over this file. mango reloads when it changes, and
# `wlr-randr` lists every output with its modes.
#
# With no rule for it, an output gets its preferred mode (2560x1440@75 on the
# Samsung), an automatic position and scale 1. Hyprland's "highres" took the
# highest resolution and then the fastest refresh; for a screen whose preferred
# mode is slower than that, name the mode in a rule of its own.
#
# This catch-all only adds variable refresh rate on every output, always on:
# switching it per fullscreen window made the Samsung go black for ~2 s at
# every toggle. Exactly one rule should match each output - mango takes the
# FIRST match when an output appears but the LAST one on a config reload - so
# with rules for named outputs, keep them out of the catch-all, e.g.
#   monitor_rule=name:^DP-3$,width:2560,height:1440,refresh:75,vrr:1
#   monitor_rule=name:^(?!DP-3$).*$,vrr:1
# (Monitor_Profiles/default.conf has more examples.)
monitor_rule=name:.*,vrr:1
