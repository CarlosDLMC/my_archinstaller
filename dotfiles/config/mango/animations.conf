# Animations. No bounce anywhere: every curve keeps y inside [0, 1].
# Curves are CSS cubic-beziers (x1,y1,x2,y2, no negative numbers); durations
# are milliseconds. The timings are the ones the Hyprland config had (omarchy's
# window animations, the "wind" workspace slide); the names in brackets are
# the curves they used:
#   easeOutQuint 0.23,1,0.32,1      linear 0,0,1,1
#   almostLinear 0.5,0.5,0.75,1     smoothOut 0.5,0,0.99,0.99
#   quick 0.15,0,0.1,1              wind 0.05,0.9,0.1,1
# Several options here come from the patched mango (pkgbuilds/mangowm).
#
# Left as it is: a fade lasts as long as its open or close; the open fade's
# curve below ends at the same moment as Hyprland's 173 ms fade-in.

animations=1

# Windows opening: grow from 87% (popin 87%) in 410 ms [easeOutQuint],
# fading in from nothing.
animation_type_open=zoom
zoom_initial_ratio=0.87
animation_duration_open=410
animation_curve_open=0.23,1,0.32,1
animation_fade_in=1
fade_in_begin_opacity=0.0
# Over in the first 42% (173 of 410 ms), shaped like almostLinear.
animation_curve_opacity_fade_in=0.444,1,0.072,1

# Windows closing: shrink to 87% in 149 ms [linear], fading out [almostLinear],
# under the bar and the launchers.
animation_type_close=zoom
zoom_end_ratio=0.87
animation_duration_close=149
animation_curve_close=0,0,1,1
animation_fade_out=1
fade_out_begin_opacity=1.0
animation_curve_opacity_fade_out=0.5,0.5,0.75,1
fadeout_below_top=1

# Moves and resizes: 379 ms [easeOutQuint]. A window keeps its content at its
# native size while its box animates, cropped or with its edge extended, as
# Hyprland draws it; an opening window scales into place (the popin above).
animation_duration_move=379
animation_curve_move=0.23,1,0.32,1
animation_native_content=1

# Workspace switch: a horizontal slide, 500 ms [wind]. The old and the new
# workspace move as one strip (mango always uses one curve for both).
tag_animation_direction=1
animation_duration_tag=500
animation_curve_tag=0.05,0.9,0.1,1
# The special workspace (SUPER ALT U) slides in from the right, fading in.
special_slide_fade=1

# Focus change: opacity (terminals go from 1.0 to 0.82 when they lose focus)
# in 300 ms [smoothOut]; the border and shadow colour in 539 ms [easeOutQuint].
animation_duration_focus=300
animation_curve_focus=0.5,0,0.99,0.99
animation_duration_border=539
animation_curve_border=0.23,1,0.32,1

# Layer surfaces (rofi, notifications, the bar's cards) fade in and out in
# 303 ms [quick], with no movement. rules.conf turns it off for the
# notifications, the CRT power-off and every quickshell surface that animates
# itself.
layer_animations=1
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_duration_layer_open=303
animation_duration_layer_close=303
animation_curve_layer_fade_in=0.15,0,0.1,1
animation_curve_layer_fade_out=0.15,0,0.1,1

# Desktop zoom (SUPER ALT wheel) eases in over 800 ms [Hyprland's default
# curve 0,0.75,0.15,1]: the patch's own defaults.
