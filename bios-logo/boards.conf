# Known motherboards for bios-logo/mod-bios-logo.sh
#
# One line per board, fields separated by '|':
#   board_name (exactly as /sys/class/dmi/id/board_name) | vendor | CAP file name the
#   flasher expects | download URL template (VER is replaced) | logo spec last seen |
#   status
#
# The logo spec is informational - the script always reads the real dimensions and
# depth out of the downloaded image. "status" records whether the flash tool accepted
# a modified capsule on that board, which is the only thing that cannot be checked
# from software.
#
# ASUS download URLs: the model name with spaces turned into dashes, then
# "-ASUS-<version>". The extension is ".zip" on older releases and ".ZIP" on newer
# ones; the script probes both.

TUF GAMING B650M-PLUS WIFI|ASUS|TG650MPW.CAP|https://dlcdnets.asus.com/pub/ASUS/mb/BIOS/TUF-GAMING-B650M-PLUS-WIFI-ASUS-VER.ZIP|672x378 24-bit, LZMA budget ~249 KB|FlashBack accepted the modified 3886 capsule, 2026-09-13. Known-good: `build --height 300` on stock 3886 -> sha256 afdfe1f9c749d88261fa11f8ac4900834ba45cdcb924aa0b8e75acb224ce50bf. Other sizes: a 468x620 logo flashed 2026-10-08 and shows (BGRT reports it scaled to 434x576) - worked: `build --logo icons/gopnik-watermark-1080p.png --colors full --keep-size` on stock 3886 -> sha256 f37bee9a9abe8c26463dfd3d33f2b076f4a86a35ff594f01f13029c92006d8fc. Boot Logo Display=Auto fits any logo into a 1024x576 box at 2560x1440; Full Screen scales it to the screen, so a screen-sized logo is drawn 1:1. In use since 2026-10-08 (Full Screen): `magick -size 2560x1440 xc:black icons/gopnik-watermark-1440p.png -geometry +955+29 -composite -type TrueColor PNG24:logo.png` (the Plymouth size and place), then `build --logo logo.png --colors full --keep-size` on stock 3886 -> sha256 92b03f0d14b1a54d1e95727c96929686a4ca31d427024d04e7dec5a4ba3b45b2 (~176 KB of the ~203 KB budget)
