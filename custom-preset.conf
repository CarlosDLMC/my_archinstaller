#!/bin/bash
# Custom preset configuration for personalized Arch-Hyprland installation
# This preset includes all the customizations: quickshell bar, foot terminal,
# hyprsunset, wireguard, event-based monitoring, and more.

# Enable GTK themes for Dark/Light mode functionality
gtk_themes="ON"

# Bluetooth. "auto" installs and enables it only when a controller is actually
# present, so a desktop without one does not get a bluez service that can never
# do anything - or a bar widget whose dropdown is permanently empty.
bluetooth="auto"

# Enable Thunar file manager
thunar="ON"

# Enable quickshell (replaces AGS) - REQUIRED for custom bar
quickshell="ON"

# Enable ly display manager (lightweight TUI display manager)
ly="ON"

# The flag waving on ly's login screen: soviet, sweden, norway, denmark,
# finland, russia, spain, italy, poland, ukraine, belarus, germany,
# russianempire, china, vietnam, northkorea or southkorea. All of them are
# installed, so flag-switch.sh can change it later without re-running the
# installer.
ly_flag="soviet"

# Enable XDG Desktop Portal Hyprland for screen sharing
xdph="ON"

# Enable zsh with Oh-My-Zsh
zsh="ON"

# Pokemon color scripts. This is NOT optional decoration: .zshrc unconditionally
# runs ~/pokefetch_perfect, which shells out to `pokemon-colorscripts`, and that
# binary is installed here and nowhere else. With this OFF every new terminal
# opened "pokemon-colorscripts: command not found" and the greeting lost its
# art, which is how it shipped until now.
pokemon="ON"

# ROG laptop support. "auto" reads /sys/class/dmi/id/sys_vendor, so asusctl and
# rog-control-center are installed on ASUS laptops and skipped everywhere else.
# No supergfxctl: asusctl 6.x switches the GPU itself, and supergfxd undid it.
rog="auto"

# Enable custom dotfiles installation - REQUIRED
dots="ON"

# Input group for waybar functionality (set to OFF, waybar not used)
input_group="OFF"

# NVIDIA configuration. "auto" installs the proprietary driver when lspci sees
# an NVIDIA GPU a maintained driver supports - nvidia-open-dkms for Turing and
# newer, the legacy 580xx branch for Maxwell/Pascal/Volta - and does nothing
# otherwise (Kepler and older stay on nouveau).
#
# This is "auto" rather than "OFF" because a preset travels between machines
# and this one was written on an Intel-graphics laptop. Hardcoding "OFF" meant
# that carrying this file to an NVIDIA machine silently skipped nvidia.sh: no
# driver, no prompt, and 02-Final-Check.sh could not report it because nothing
# had been attempted. Set "OFF" to deliberately keep the open-source driver.
nvidia="auto"

# Nouveau blacklist. "auto" blacklists it exactly when the proprietary driver
# above is being installed, which is what that driver expects. Set "OFF" to
# keep nouveau loadable.
nouveau="auto"

# Handy offline speech-to-text (binds CTRL+SUPER+F8 to toggle transcription)
handy="ON"

# Passwordless sudo for the wheel group. Arch ships this commented out; it is ON
# here on purpose. The bar's VPN widget shells out to `sudo find /etc/wireguard`,
# `sudo wg-quick up|down` and `sudo timedatectl set-timezone` from a QML Process
# that has no terminal to prompt on, so with stock sudoers the VPN dropdown
# silently does nothing.
# The trade: any process running as your user can become root without a prompt.
nopasswd_sudo="ON"

# Docker, socket-activated (the daemon is not resident; any `docker` command
# starts it). ON here because this is what the installer has always done - the
# call used to be unconditional, with no way to decline it.
#
# It also adds you to the "docker" group. That group talks to a root-owned
# daemon socket, so a member can `docker run -v /:/host` and be root without a
# password. Alongside nopasswd_sudo="ON" above that grants nothing new. On a
# machine where you set nopasswd_sudo="OFF", set this to "OFF" too unless you
# actually want Docker - otherwise it hands back the root access you just
# declined, more quietly.
docker="ON"

# CUPS printing. Nothing else in the install pulls in a print stack, so with
# this OFF every print dialog on the new machine comes up with an empty printer
# list. Installed with socket activation, so cupsd is not resident - see
# install-scripts/printing.sh. The printer itself still has to be re-added:
# /etc/cups/printers.conf holds a LAN device URI that is machine-specific.
printing="ON"

# Plymouth boot splash with the repo logo instead of the distro's, on every
# machine. "ON" installs plymouth and the theme, and where the distro did not
# set plymouth up (plain Arch) it also wires it into boot: the plymouth hook
# through a drop-in in /etc/mkinitcpio.conf.d, and `splash` on the kernel
# command line of whichever bootloader is there (systemd-boot, GRUB, Limine, or
# /etc/kernel/cmdline for UKIs), keeping each original as <file>.pre-plymouth.
# "auto" would act only where plymouth is already installed and hooked in, as
# on CachyOS. See install-scripts/plymouth.sh. OFF here: text_boot, below, is
# this machine's choice.
plymouth="OFF"

# Text boot: after the bootloader menu the screen shows the kernel's messages
# and systemd's "[  OK  ]" lines, as on a plain Arch install, instead of a
# splash. Takes `quiet` and `splash` off the kernel command line wherever the
# machine keeps one (CachyOS ships both: they hide the lines and put its
# watermark splash over them), keeping each original as <file>.pre-text-boot,
# and drops the `kms` initramfs hook so the GPU driver's black-screen moment
# comes after the LUKS prompt, not during it.
# Plymouth, where the distro installed it, stays and runs in text mode. Skipped
# when plymouth="ON". See install-scripts/text-boot.sh.
text_boot="ON"

# Limine boot-menu theme (assets/limine/) and no auto-boot countdown. "auto" acts
# only where a limine.conf exists. One of the two steps that edit a bootloader
# config (the other is plymouth's `splash`, above): it prepends a marked block,
# sets `timeout: no`, keeps a backup as limine.conf.pre-theme and refuses to
# write if the OS entries would change - see install-scripts/limine.sh.
limine="auto"

# The same logo on Windows' boot screen, on a Limine dual boot: HackBGRT
# (downloaded, sha256-pinned) on Windows' EFI partition, started by Limine's
# Windows entry, with the Plymouth watermark rendered at its Plymouth size and
# place for this panel. "auto" acts only where limine.conf has a Windows entry
# and Secure Boot is off. See install-scripts/hackbgrt.sh.
hackbgrt="auto"

# Herdr - terminal workspace manager for AI coding agents. Not in the repos or
# the AUR: herdr.sh downloads the static binary from herdr.dev and verifies its
# sha256. Needs "dots" ON, which owns the config, sounds and helper scripts.
herdr="ON"

# Neovim with the LazyVim config. This is where the file explorer comes from -
# herdr has no file browser, and the tree in the editor pane is snacks.explorer
# on Space E. Also pulls ripgrep/fd for its pickers.
neovim="ON"

# Hunk - review-first terminal diff viewer for agent-authored changesets. Not in
# the repos or the AUR: hunk.sh resolves the GitHub release and checks it against
# the published SHA256SUMS. This is the pane that shows what the agents wrote.
hunk="ON"
