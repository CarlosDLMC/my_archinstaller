# --- my_archinstaller Limine theme (assets/limine/theme.conf) ---
# Global options only; the kernel entries below are managed by limine-entry-tool.
wallpaper: boot():/limine-wallpaper.png
wallpaper_style: stretched
interface_branding: Soviet Boot Menu
interface_branding_colour: cc9933
interface_help_hidden: yes
interface_help_colour: 806a3a
term_margin: 96
term_margin_gradient: 0
# TTRRGGBB, TT = transparency: ff = the text box is fully transparent over the wallpaper
term_background: ff000000
# The selected entry is drawn in reverse video, so this is also the highlight bar colour
term_foreground: e8dcc4
# black;red;green;brown;blue;magenta;cyan;gray - cyan is what entry comments print in
term_palette: 000000;b3141b;5c8a3a;cc9933;3a5f8a;8a3a6a;cc9933;e8dcc4
term_palette_bright: 555555;ff4a4a;7ec850;ffcc44;6699cc;cc66aa;ffcc44;ffffff
term_font_scale: 2x2
# --- end theme ---

