# --- my_archinstaller Limine theme (assets/limine/theme.conf) ---
# Global options only; the kernel entries below are managed by limine-entry-tool.
# The wallpaper is used exactly as delivered (no title, no darkening). Limine's terminal
# maps text to the 256-glyph CP437 set, which has no Cyrillic, so interface_branding stays
# unset; make-wallpaper.sh can paint a Cyrillic title into a copy if wanted.
wallpaper: boot():/limine-wallpaper.png
wallpaper_style: stretched
interface_help_hidden: no
# Colour of the "Booting in N seconds" countdown
interface_help_colour: 5f8f5f
interface_help_colour_bright: 9be89b
# Margin around the menu box
term_margin: 96
term_margin_gradient: 0
# TTRRGGBB, TT = transparency: ff = the text box is fully transparent over the wallpaper
term_background: ff000000
# Phosphor green like the CRTs in the picture. The selected entry is reverse video,
# so this is also the highlight bar colour (dark text on green).
term_foreground: 9be89b
# black;red;green;brown;blue;magenta;cyan;gray - cyan is what entry comments print in
term_palette: 0a140a;d42a2a;5c8a3a;b08a2e;3a5f8a;8a3a6a;5f8f5f;9be89b
term_palette_bright: 3a5a3a;ff4a4a;7ee07e;ffcc44;6699cc;cc66aa;7ec87e;e8ffe8
term_font_scale: 2x2
# --- end theme ---

